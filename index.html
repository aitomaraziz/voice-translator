<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم الصوت الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #64ffda, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #8892b0;
            font-size: 13px;
            margin-top: 5px;
        }

        /* Detected Language */
        .detected {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: rgba(100, 255, 218, 0.1);
            border-radius: 16px;
            margin: 15px 0;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }

        .detected .flag {
            font-size: 40px;
        }

        .detected .info {
            text-align: right;
        }

        .detected .label {
            font-size: 11px;
            color: #8892b0;
        }

        .detected .lang {
            font-size: 22px;
            font-weight: 700;
            color: #64ffda;
        }

        .arrow-to {
            font-size: 24px;
            color: #ffd93d;
        }

        .detected .target-lang {
            font-size: 22px;
            font-weight: 700;
            color: #ffd93d;
        }

        /* Status */
        .status {
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff6b6b;
            margin-left: 8px;
            vertical-align: middle;
        }

        .status-dot.on {
            background: #64ffda;
        }

        .status-dot.listening {
            background: #ff6b6b;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        .status-text {
            font-size: 13px;
            color: #8892b0;
            vertical-align: middle;
        }

        /* Talk Button */
        .talk-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
        }

        .talk-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #64ffda, #4dd0b8);
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 0 60px rgba(100, 255, 218, 0.4);
        }

        .talk-btn:hover {
            transform: scale(1.05);
        }

        .talk-btn.listening {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            box-shadow: 0 0 80px rgba(255, 107, 107, 0.6);
            animation: pulse-btn 1s infinite;
        }

        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .mic-icon {
            font-size: 60px;
        }

        .talk-label {
            margin-top: 15px;
            font-size: 16px;
            color: #8892b0;
        }

        /* Wave */
        .wave {
            display: none;
            justify-content: center;
            gap: 4px;
            margin-top: 15px;
            height: 40px;
            align-items: center;
        }

        .wave.active {
            display: flex;
        }

        .wave-bar {
            width: 4px;
            height: 15px;
            background: #64ffda;
            border-radius: 2px;
            animation: wave-anim 0.6s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave-anim {
            0%, 100% { height: 10px; }
            50% { height: 40px; }
        }

        /* Text Cards */
        .text-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .text-card {
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 14px;
            position: relative;
            min-height: 70px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .text-card.original {
            border-right: 3px solid #64ffda;
        }

        .text-card.translated {
            border-left: 3px solid #ffd93d;
        }

        .text-card .label {
            font-size: 11px;
            color: #8892b0;
            margin-bottom: 6px;
        }

        .text-card .content {
            font-size: 18px;
            line-height: 1.6;
            color: #ccd6f6;
            word-wrap: break-word;
        }

        .text-card .play-btn {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 217, 61, 0.2);
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .text-card .play-btn:hover {
            background: rgba(255, 217, 61, 0.4);
        }

        .arrow-down {
            text-align: center;
            font-size: 20px;
            color: #64ffda;
        }

        /* History */
        .history-title {
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 8px;
        }

        .history-list {
            max-height: 100px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 12px;
            border-right: 2px solid #64ffda;
        }

        .history-item .orig {
            color: #8892b0;
        }

        .history-item .trans {
            color: #ffd93d;
        }

        .footer {
            text-align: center;
            padding: 10px;
            color: #5a6a8a;
            font-size: 10px;
        }

        @media (max-width: 400px) {
            .talk-btn { width: 130px; height: 130px; }
            .mic-icon { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 المترجم الذكي</h1>
            <p>يتعرف على اللغة تلقائياً من الصوت</p>
        </div>

        <div class="detected">
            <div>
                <div class="flag" id="sourceFlag">🎤</div>
                <div class="lang" id="sourceLang">...</div>
            </div>
            <div class="arrow-to">→</div>
            <div>
                <div class="flag" id="targetFlag">🔊</div>
                <div class="target-lang" id="targetLang">...</div>
            </div>
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">جاهز</span>
        </div>

        <div class="talk-area">
            <button class="talk-btn" id="talkBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="talk-label">اضغط وابدأ بالتحدث</div>
            <div class="wave" id="wave">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <div class="text-section">
            <div class="text-card original">
                <div class="label">ما قلته</div>
                <div class="content" id="origText">...</div>
            </div>
            <div class="arrow-down">↓</div>
            <div class="text-card translated">
                <div class="label">الترجمة</div>
                <div class="content" id="transText">...</div>
                <button class="play-btn" id="playBtn">🔊</button>
            </div>
        </div>

        <div class="history-title">📝 آخر الترجمات</div>
        <div class="history-list" id="historyList"></div>

        <div class="footer">يكتشف اللغة من الصوت وترجمها تلقائياً</div>
    </div>

    <script>
        // ========== Config ==========
        const LANGS = {
            'ar': { name: 'العربية', flag: '🇸🇦', to: 'zh-CN', toName: '中文', toFlag: '🇨🇳' },
            'zh-CN': { name: '中文', flag: '🇨🇳', to: 'ar', toName: 'العربية', toFlag: '🇸🇦' },
            'en': { name: 'English', flag: '🇺🇸', to: 'ar', toName: 'العربية', toFlag: '🇸🇦' }
        };

        // ========== State ==========
        let isListening = false;
        let recognition = null;
        let currentSourceLang = null;
        let lastTranslation = '';

        // ========== Elements ==========
        const talkBtn = document.getElementById('talkBtn');
        const origText = document.getElementById('origText');
        const transText = document.getElementById('transText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const wave = document.getElementById('wave');
        const historyList = document.getElementById('historyList');
        const sourceFlag = document.getElementById('sourceFlag');
        const sourceLang = document.getElementById('sourceLang');
        const targetFlag = document.getElementById('targetFlag');
        const targetLang = document.getElementById('targetLang');
        const playBtn = document.getElementById('playBtn');

        // ========== Check Browser ==========
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SR) {
            statusText.textContent = 'استخدم Chrome للمتصفح';
            talkBtn.disabled = true;
        } else {
            statusDot.classList.add('on');
            statusText.textContent = 'جاهز - اضغط للتحدث';
            createRecognition();
        }

        // ========== Create Speech Recognition ==========
        function createRecognition() {
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ar'; // Default, will change based on detection

            recognition.onstart = () => {
                isListening = true;
                talkBtn.classList.add('listening');
                wave.classList.add('active');
                statusDot.classList.remove('on');
                statusDot.classList.add('listening');
                statusText.textContent = 'أستمع الآن...';
            };

            recognition.onend = () => {
                isListening = false;
                talkBtn.classList.remove('listening');
                wave.classList.remove('active');
                statusDot.classList.remove('listening');
                statusDot.classList.add('on');
                statusText.textContent = 'جاهز - اضغط للتحدث';
            };

            recognition.onresult = (event) => {
                let finalText = '';
                let interimText = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalText += text;
                    } else {
                        interimText += text;
                    }
                }

                if (interimText) {
                    origText.textContent = interimText;
                }

                if (finalText) {
                    origText.textContent = finalText;
                    detectAndTranslate(finalText);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    statusText.textContent = 'لم أسمع صوتاً...';
                } else if (event.error === 'not-allowed') {
                    statusText.textContent = 'سمح بالوصول للميكروفون';
                }
                isListening = false;
                talkBtn.classList.remove('listening');
                wave.classList.remove('active');
            };
        }

        // ========== Detect Language from Text ==========
        function detectLanguage(text) {
            const cleanText = text.trim();
            
            // Count characters in each script
            let arabicCount = 0;
            let chineseCount = 0;
            let englishCount = 0;

            for (let char of cleanText) {
                const code = char.charCodeAt(0);
                
                // Arabic: 0x0600 - 0x06FF, 0xFB50 - 0xFDFF, 0xFE70 - 0xFEFF
                if ((code >= 0x0600 && code <= 0x06FF) || 
                    (code >= 0xFB50 && code <= 0xFDFF) || 
                    (code >= 0xFE70 && code <= 0xFEFF)) {
                    arabicCount++;
                }
                // Chinese: 0x4E00 - 0x9FFF
                else if (code >= 0x4E00 && code <= 0x9FFF) {
                    chineseCount++;
                }
                // English: a-z, A-Z
                else if ((code >= 65 && code <= 90) || (code >= 97 && code <= 122)) {
                    englishCount++;
                }
            }

            // Determine language based on character count
            const max = Math.max(arabicCount, chineseCount, englishCount);
            
            if (max === 0) return 'ar'; // Default
            if (arabicCount === max) return 'ar';
            if (chineseCount === max) return 'zh-CN';
            if (englishCount === max) return 'en';
            
            return 'ar';
        }

        // ========== Detect and Translate ==========
        function detectAndTranslate(text) {
            const detected = detectLanguage(text);
            currentSourceLang = detected;
            
            const config = LANGS[detected];
            
            // Update UI
            sourceFlag.textContent = config.flag;
            sourceLang.textContent = config.name;
            targetFlag.textContent = config.toFlag;
            targetLang.textContent = config.toName;

            // Translate
            translateText(text, detected, config.to);
        }

        // ========== Translation API ==========
        async function translateText(text, from, to) {
            if (!text.trim()) return;

            transText.textContent = 'جاري الترجمة...';

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const translated = data.responseData.translatedText;
                    transText.textContent = translated;
                    lastTranslation = translated;
                    addToHistory(text, translated, config?.flag || '', LANGS[to]?.flag || '');
                    speakTranslation(translated, to);
                } else {
                    transText.textContent = 'خطأ في الترجمة';
                }
            } catch (err) {
                transText.textContent = 'تحقق من الإنترنت';
            }
        }

        // ========== Text to Speech ==========
        function speakTranslation(text, lang) {
            if (!text) return;

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9;

            const voices = window.speechSynthesis.getVoices();
            const voice = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (voice) utterance.voice = voice;

            window.speechSynthesis.speak(utterance);
        }

        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };

        // ========== Start/Stop ==========
        function startListening() {
            if (isListening) return;
            try {
                recognition.start();
            } catch (e) {}
        }

        function stopListening() {
            if (!isListening) return;
            try {
                recognition.stop();
            } catch (e) {}
        }

        // ========== History ==========
        function addToHistory(orig, trans, fromFlag, toFlag) {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="orig">${fromFlag} ${orig}</div>
                <div class="trans">${toFlag} ${trans}</div>
            `;
            historyList.insertBefore(item, historyList.firstChild);
            while (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        // ========== Events ==========
        talkBtn.addEventListener('click', () => {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                startListening();
            }
        });

        playBtn.addEventListener('click', () => {
            if (lastTranslation && currentSourceLang) {
                const to = LANGS[currentSourceLang]?.to || 'ar';
                speakTranslation(lastTranslation, to);
            }
        });
    </script>
</body>
</html>
