<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم فوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d1b2a);
            min-height: 100vh;
            color: #fff;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header { text-align: center; padding: 15px 0; }
        .header h1 { font-size: 26px; background: linear-gradient(90deg, #00d4ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* UI Language Switcher */
        .ui-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 5px 0 10px;
        }

        .ui-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #888;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .ui-btn.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
        }

        /* Language Selectors */
        .lang-select {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-select .box { flex: 1; text-align: center; }
        .lang-select .label { font-size: 11px; color: #888; margin-bottom: 8px; }

        .lang-select select {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            text-align: center;
        }

        .lang-select select option { background: #1a1a3e; color: #fff; }

        .lang-select .swap-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0088cc);
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .lang-select .swap-btn:hover { transform: scale(1.1) rotate(180deg); }

        /* Status */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot.on { background: #00ff88; }
        .dot.rec { background: #ff4444; animation: blink 0.5s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .status-text { font-size: 13px; color: #888; }

        /* Mic Button */
        .mic-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
        }

        .mic-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00d4ff, #0088cc);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
        }

        .mic-btn:hover { transform: scale(1.05); }

        .mic-btn.rec {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            box-shadow: 0 0 60px rgba(255, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .mic-icon { font-size: 60px; }
        .mic-label { margin-top: 15px; font-size: 16px; color: #888; text-align: center; }

        .waves { display: none; justify-content: center; gap: 3px; margin-top: 15px; height: 30px; align-items: center; }
        .waves.on { display: flex; }
        .bar { width: 4px; height: 10px; background: #00ff88; border-radius: 2px; animation: wave 0.5s ease-in-out infinite; }
        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.08s; }
        .bar:nth-child(3) { animation-delay: 0.16s; }
        .bar:nth-child(4) { animation-delay: 0.24s; }
        .bar:nth-child(5) { animation-delay: 0.32s; }
        @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 30px; } }

        /* Cards */
        .cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .card { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; min-height: 60px; position: relative; }
        .card.src { border-right: 3px solid #00ff88; }
        .card.dst { border-left: 3px solid #ffd93d; }
        .card .tag { font-size: 10px; color: #666; margin-bottom: 5px; }
        .card .txt { font-size: 17px; line-height: 1.5; color: #ddd; }
        .card .speak-btn { position: absolute; bottom: 10px; left: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 217, 61, 0.2); border: none; font-size: 14px; cursor: pointer; }
        .arrow { text-align: center; color: #00ff88; font-size: 18px; }

        .footer { text-align: center; padding: 10px; color: #444; font-size: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1 id="appTitle">⚡ مترجم فوري</h1>
        </div>

        <!-- UI Language Switcher -->
        <div class="ui-switch">
            <button class="ui-btn" id="uiAr" onclick="setUI('ar')">العربية</button>
            <button class="ui-btn" id="uiZh" onclick="setUI('zh')">中文</button>
            <button class="ui-btn" id="uiEn" onclick="setUI('en')">English</button>
        </div>

        <!-- Language Selectors -->
        <div class="lang-select">
            <div class="box">
                <div class="label" data-i18n="speakLabel">أنا أتحدث</div>
                <select id="srcSelect">
                    <option value="ar" selected>🇸🇦 العربية</option>
                    <option value="zh-CN">🇨🇳 中文</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
            <button class="swap-btn" id="swapBtn">⇄</button>
            <div class="box">
                <div class="label" data-i18n="trLabel">ترجم إلى</div>
                <select id="dstSelect">
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="zh-CN" selected>🇨🇳 中文</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
        </div>

        <div class="status-bar">
            <div class="dot" id="dot"></div>
            <span class="status-text" id="stxt" data-i18n="ready">جاهز</span>
        </div>

        <div class="mic-area">
            <button class="mic-btn" id="micBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="mic-label" id="micLabel" data-i18n="micHint">اضغط وابدأ بالتحدث</div>
            <div class="waves" id="waves">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="cards">
            <div class="card src">
                <div class="tag" id="srcTag" data-i18n="saidTag">ما قلته</div>
                <div class="txt" id="srcTxt">...</div>
            </div>
            <div class="arrow">↓</div>
            <div class="card dst">
                <div class="tag" id="dstTag" data-i18n="trTag">الترجمة</div>
                <div class="txt" id="dstTxt">...</div>
                <button class="speak-btn" id="speakBtn" title="🔊">🔊</button>
            </div>
        </div>

        <div class="footer" data-i18n="footer">اختر لغتك واللغة المطلوب الترجمة إليها - ثم تحدث</div>
    </div>

    <script>
        // ========== Translations ==========
        const I18N = {
            ar: {
                appTitle: '⚡ مترجم فوري',
                speakLabel: 'أنا أتحدث',
                trLabel: 'ترجم إلى',
                ready: 'جاهز',
                micHint: 'اضغط وابدأ بالتحدث',
                saidTag: 'ما قلته',
                trTag: 'الترجمة',
                footer: 'اختر لغتك واللغة المطلوب الترجمة إليها - ثم تحدث',
                listening: 'أستمع...',
                speakNow: 'اتكلم الآن',
                noSpeech: 'لم أسمع صوتاً',
                needMic: 'السماح بالوصول للميكروفون',
                useChrome: 'استخدم Chrome',
                micDenied: 'تم رفض الوصول للميكروفون',
                translating: 'جاري الترجمة...',
                transError: 'خطأ في الترجمة',
                transNoNet: 'تحقق من الإنترنت'
            },
            zh: {
                appTitle: '⚡ 即时翻译',
                speakLabel: '我说',
                trLabel: '翻译为',
                ready: '准备就绪',
                micHint: '按下并开始说话',
                saidTag: '我所说',
                trTag: '翻译',
                footer: '选择你的语言及目标语言，然后说话',
                listening: '正在聆听...',
                speakNow: '请说话',
                noSpeech: '未听到声音',
                needMic: '需要允许麦克风',
                useChrome: '请使用 Chrome',
                micDenied: '麦克风被拒绝',
                translating: '正在翻译...',
                transError: '翻译错误',
                transNoNet: '检查互联网'
            },
            en: {
                appTitle: '⚡ Instant Translator',
                speakLabel: 'I speak',
                trLabel: 'Translate to',
                ready: 'Ready',
                micHint: 'Press and start speaking',
                saidTag: 'What I said',
                trTag: 'Translation',
                footer: 'Choose your language and target language, then speak',
                listening: 'Listening...',
                speakNow: 'Speak now',
                noSpeech: 'No speech detected',
                needMic: 'Please allow microphone',
                useChrome: 'Use Chrome',
                micDenied: 'Microphone access denied',
                translating: 'Translating...',
                transError: 'Translation error',
                transNoNet: 'Check internet'
            }
        };

        // ========== Config ==========
        const LANG = {
            'ar': { name: 'العربية', flag: '🇸🇦' },
            'zh-CN': { name: '中文', flag: '🇨🇳' },
            'en': { name: 'English', flag: '🇺🇸' }
        };

        // ========== State ==========
        let uiLang = 'ar';
        let srcLang = 'ar';
        let dstLang = 'zh-CN';
        let isRec = false;
        let rec = null;
        let lastSpoken = '';

        // ========== Elements ==========
        const micBtn = document.getElementById('micBtn');
        const micLabel = document.getElementById('micLabel');
        const srcTxt = document.getElementById('srcTxt');
        const dstTxt = document.getElementById('dstTxt');
        const srcTag = document.getElementById('srcTag');
        const dstTag = document.getElementById('dstTag');
        const dot = document.getElementById('dot');
        const stxt = document.getElementById('stxt');
        const waves = document.getElementById('waves');
        const speakBtn = document.getElementById('speakBtn');
        const srcSelect = document.getElementById('srcSelect');
        const dstSelect = document.getElementById('dstSelect');
        const swapBtn = document.getElementById('swapBtn');
        const appTitle = document.getElementById('appTitle');
        const uiAr = document.getElementById('uiAr');
        const uiZh = document.getElementById('uiZh');
        const uiEn = document.getElementById('uiEn');

        // ========== Set UI Language ==========
        function setUI(lang) {
            uiLang = lang;
            const t = I18N[lang];

            appTitle.textContent = t.appTitle;
            document.querySelector('[data-i18n="speakLabel"]').textContent = t.speakLabel;
            document.querySelector('[data-i18n="trLabel"]').textContent = t.trLabel;
            stxt.textContent = t.ready;
            micLabel.textContent = t.micHint;
            document.querySelector('[data-i18n="saidTag"]').textContent = t.saidTag;
            document.querySelector('[data-i18n="trTag"]').textContent = t.trTag;
            document.querySelector('[data-i18n="footer"]').textContent = t.footer;

            uiAr.classList.toggle('active', lang === 'ar');
            uiZh.classList.toggle('active', lang === 'zh');
            uiEn.classList.toggle('active', lang === 'en');

            updateLabels();
        }

        // ========== Update Labels ==========
        function updateLabels() {
            srcTag.textContent = `${I18N[uiLang].saidTag} (${LANG[srcLang].name})`;
            dstTag.textContent = `${I18N[uiLang].trTag} (${LANG[dstLang].name})`;
        }

        // ========== Check Browser ==========
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            stxt.textContent = I18N[uiLang].useChrome;
            micBtn.disabled = true;
        } else {
            dot.classList.add('on');
        }

        // ========== Init Recognizer ==========
        function initRec() {
            rec = new SR();
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = srcLang;

            rec.onstart = () => {
                isRec = true;
                micBtn.classList.add('rec');
                waves.classList.add('on');
                dot.classList.remove('on');
                dot.classList.add('rec');
                stxt.textContent = I18N[uiLang].listening;
                micLabel.textContent = I18N[uiLang].speakNow;
            };

            rec.onend = () => {
                isRec = false;
                micBtn.classList.remove('rec');
                waves.classList.remove('on');
                dot.classList.remove('rec');
                dot.classList.add('on');
                stxt.textContent = I18N[uiLang].ready;
                micLabel.textContent = I18N[uiLang].micHint;
            };

            rec.onresult = (event) => {
                let finalText = '';
                let interimText = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalText += text;
                    } else {
                        interimText += text;
                    }
                }

                if (interimText) srcTxt.textContent = interimText;

                if (finalText && finalText.trim().length > 1) {
                    srcTxt.textContent = finalText;
                    translate(finalText, srcLang, dstLang);
                }
            };

            rec.onerror = (e) => {
                if (e.error === 'no-speech') stxt.textContent = I18N[uiLang].noSpeech;
                else if (e.error === 'not-allowed') stxt.textContent = I18N[uiLang].micDenied;
                isRec = false;
                micBtn.classList.remove('rec');
                waves.classList.remove('on');
            };
        }

        // ========== Translate ==========
        async function translate(text, from, to) {
            if (from === to) {
                dstTxt.textContent = text;
                lastSpoken = text;
                return;
            }

            dstTxt.textContent = I18N[uiLang].translating;

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const trans = data.responseData.translatedText;
                    dstTxt.textContent = trans;
                    lastSpoken = trans;
                    speak(trans, to);
                } else {
                    dstTxt.textContent = I18N[uiLang].transError;
                }
            } catch (e) {
                dstTxt.textContent = I18N[uiLang].transNoNet;
            }
        }

        // ========== Speak ==========
        function speak(text, lang) {
            if (!text) return;
            window.speechSynthesis.cancel();

            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.rate = 1;

            const voices = window.speechSynthesis.getVoices();
            const v = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (v) u.voice = v;

            window.speechSynthesis.speak(u);
        }

        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

        // ========== Start/Stop ==========
        function start() {
            if (isRec || !rec) return;
            try { rec.start(); } catch (e) {}
        }

        function stop() {
            if (!isRec || !rec) return;
            try { rec.stop(); } catch (e) {}
        }

        // ========== Init ==========
        initRec();
        setUI('ar');
        updateLabels();

        // ========== Events ==========
        micBtn.onclick = () => isRec ? stop() : start();

        srcSelect.onchange = () => {
            srcLang = srcSelect.value;
            if (rec) rec.lang = srcLang;
            updateLabels();
        };

        dstSelect.onchange = () => {
            dstLang = dstSelect.value;
            updateLabels();
        };

        swapBtn.onclick = () => {
            const temp = srcLang;
            srcLang = dstLang;
            dstLang = temp;
            srcSelect.value = srcLang;
            dstSelect.value = dstLang;
            if (rec) rec.lang = srcLang;
            updateLabels();

            const tempText = srcTxt.textContent;
            srcTxt.textContent = dstTxt.textContent;
            dstTxt.textContent = tempText;
        };

        document.onkeydown = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                e.preventDefault();
                start();
            }
        };

        document.onkeyup = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                e.preventDefault();
                stop();
            }
        };

        speakBtn.onclick = () => {
            if (lastSpoken) speak(lastSpoken, dstLang);
        };
    </script>
</body>
</html>
