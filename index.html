<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم فوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d1b2a);
            min-height: 100vh;
            color: #fff;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header { text-align: center; padding: 20px 0 10px; }
        .header h1 { font-size: 26px; background: linear-gradient(90deg, #00d4ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot.on { background: #00ff88; }
        .dot.rec { background: #ff4444; animation: blink 0.5s infinite; }
        .dot.err { background: #ff0000; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .status-text { font-size: 13px; color: #888; }

        .log-box {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            max-height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #00ff88;
        }

        .log-line { margin: 2px 0; }
        .log-line.error { color: #ff4444; }
        .log-line.info { color: #00d4ff; }

        .mic-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .mic-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00d4ff, #0088cc);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
        }

        .mic-btn:hover { transform: scale(1.05); }

        .mic-btn.rec {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            box-shadow: 0 0 60px rgba(255, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }

        .mic-btn:disabled {
            background: #333;
            cursor: not-allowed;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .mic-icon { font-size: 60px; }
        .mic-label { margin-top: 15px; font-size: 16px; color: #888; }

        .waves { display: none; justify-content: center; gap: 3px; margin-top: 15px; height: 35px; align-items: center; }
        .waves.on { display: flex; }
        .bar { width: 4px; height: 10px; background: #00ff88; border-radius: 2px; animation: wave 0.5s ease-in-out infinite; }
        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.08s; }
        .bar:nth-child(3) { animation-delay: 0.16s; }
        .bar:nth-child(4) { animation-delay: 0.24s; }
        .bar:nth-child(5) { animation-delay: 0.32s; }
        @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 35px; } }

        .cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .card { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; min-height: 60px; position: relative; }
        .card.src { border-right: 3px solid #00ff88; }
        .card.dst { border-left: 3px solid #ffd93d; }
        .card .tag { font-size: 10px; color: #666; margin-bottom: 5px; }
        .card .txt { font-size: 17px; line-height: 1.5; color: #ddd; }
        .card .speak-btn { position: absolute; bottom: 10px; left: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 217, 61, 0.2); border: none; font-size: 14px; cursor: pointer; }
        .arrow { text-align: center; color: #00ff88; font-size: 18px; }

        .footer { text-align: center; padding: 10px; color: #444; font-size: 10px; }

        .permission-box {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
            display: none;
        }

        .permission-box.show { display: block; }
        .permission-box p { color: #ff4444; font-size: 13px; margin-bottom: 10px; }
        .permission-btn { background: #ff4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: inherit; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>⚡ مترجم فوري</h1>
        </div>

        <div class="status-bar">
            <div class="dot" id="dot"></div>
            <span class="status-text" id="stxt">جاري التحقق...</span>
        </div>

        <div class="permission-box" id="permBox">
            <p>يجب السماح بالوصول للميكروفون</p>
            <button class="permission-btn" id="permBtn">تفعيل الميكروفون</button>
        </div>

        <div class="log-box" id="logBox">
            <div class="log-line info">جاري التحقق من المتصفح...</div>
        </div>

        <div class="mic-area">
            <button class="mic-btn" id="micBtn" disabled>
                <span class="mic-icon">🎤</span>
            </button>
            <div class="mic-label" id="micLabel">جاري التحميل...</div>
            <div class="waves" id="waves">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="cards">
            <div class="card src">
                <div class="tag">ما قلته</div>
                <div class="txt" id="srcTxt">...</div>
            </div>
            <div class="arrow">↓</div>
            <div class="card dst">
                <div class="tag">الترجمة</div>
                <div class="txt" id="dstTxt">...</div>
                <button class="speak-btn" id="speakBtn">🔊</button>
            </div>
        </div>

        <div class="footer">يسمع 3 لغات في نفس الوقت</div>
    </div>

    <script>
        // ========== Elements ==========
        const micBtn = document.getElementById('micBtn');
        const micLabel = document.getElementById('micLabel');
        const srcTxt = document.getElementById('srcTxt');
        const dstTxt = document.getElementById('dstTxt');
        const dot = document.getElementById('dot');
        const stxt = document.getElementById('stxt');
        const waves = document.getElementById('waves');
        const logBox = document.getElementById('logBox');
        const permBox = document.getElementById('permBox');
        const permBtn = document.getElementById('permBtn');
        const speakBtn = document.getElementById('speakBtn');

        // ========== Config ==========
        const LANG = {
            'ar': { name: 'العربية', flag: '🇸🇦', to: 'zh-CN', toName: '中文', toFlag: '🇨🇳' },
            'zh-CN': { name: '中文', flag: '🇨🇳', to: 'ar', toName: 'العربية', toFlag: '🇸🇦' },
            'en': { name: 'English', flag: '🇺🇸', to: 'ar', toName: 'العربية', toFlag: '🇸🇦' }
        };

        // ========== State ==========
        let isRec = false;
        let recognizers = {};
        let lastSpoken = '';
        let detectedLang = null;

        // ========== Logging ==========
        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ========== Check Browser ==========
        function checkBrowser() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SR) {
                log('المتصفح لا يدعم Speech Recognition', 'error');
                stxt.textContent = 'المتصفح لا يدعم这项功能';
                micBtn.disabled = true;
                micLabel.textContent = 'استخدم Chrome';
                dot.classList.add('err');
                return false;
            }

            log('Speech Recognition مدعوم', 'info');
            return true;
        }

        // ========== Request Microphone Permission ==========
        async function requestMicPermission() {
            try {
                log('طلب صلاحية الميكروفون...', 'info');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(t => t.stop());
                log('تم الحصول على صلاحية الميكروفون', 'info');
                permBox.classList.remove('show');
                return true;
            } catch (err) {
                log(`خطأ في الصلاحية: ${err.message}`, 'error');
                permBox.classList.add('show');
                return false;
            }
        }

        // ========== Init Recognizers ==========
        function initRecognizers() {
            ['ar', 'zh-CN', 'en'].forEach(lang => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                const r = new SR();
                r.continuous = true;
                r.interimResults = true;
                r.lang = lang;
                r._lang = lang;

                r.onstart = () => log(`${lang} started`, 'info');

                r.onresult = (event) => {
                    let finalText = '';
                    let interimText = '';

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const text = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalText += text;
                        } else {
                            interimText += text;
                        }
                    }

                    if (interimText) srcTxt.textContent = interimText;

                    if (finalText && finalText.trim().length > 1) {
                        log(`[${lang}] ${finalText}`, 'info');
                        processText(finalText, lang);
                    }
                };

                r.onerror = (e) => {
                    if (e.error === 'no-speech') {
                        log(`${lang}: لا يوجد صوت`, 'info');
                    } else if (e.error === 'not-allowed') {
                        log(`${lang}: صلاحية مرفوضة`, 'error');
                    } else if (e.error !== 'aborted') {
                        log(`${lang}: ${e.error}`, 'error');
                    }
                };

                r.onend = () => {
                    log(`${lang} ended`, 'info');
                    if (isRec) {
                        setTimeout(() => {
                            try { r.start(); } catch (e) {}
                        }, 200);
                    }
                };

                recognizers[lang] = r;
            });

            log('تم إنشاء 3 مكتبات صوت', 'info');
        }

        // ========== Process Text ==========
        function processText(text, lang) {
            const config = LANG[lang];
            if (!config) return;

            detectedLang = lang;
            srcTxt.textContent = text;
            stxt.textContent = `${config.flag} ${config.name} → ${config.toFlag} ${config.toName}`;

            translate(text, lang, config.to);
        }

        // ========== Translate ==========
        async function translate(text, from, to) {
            dstTxt.textContent = 'جاري الترجمة...';
            log(`ترجمة: ${from} → ${to}`, 'info');

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const trans = data.responseData.translatedText;
                    dstTxt.textContent = trans;
                    lastSpoken = trans;
                    log(`الترجمة: ${trans}`, 'info');
                    speak(trans, to);
                } else {
                    dstTxt.textContent = 'خطأ في الترجمة';
                    log('خطأ في الترجمة', 'error');
                }
            } catch (e) {
                dstTxt.textContent = 'تحقق من الإنترنت';
                log(`خطأ: ${e.message}`, 'error');
            }
        }

        // ========== Speak ==========
        function speak(text, lang) {
            if (!text) return;
            window.speechSynthesis.cancel();

            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.rate = 1;

            const voices = window.speechSynthesis.getVoices();
            const v = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (v) u.voice = v;

            window.speechSynthesis.speak(u);
            log(`تشغيل الصوت: ${lang}`, 'info');
        }

        window.speechSynthesis.onvoiceschanged = () => {
            log('الأصوات جاهزة', 'info');
        };

        // ========== Start/Stop ==========
        function start() {
            if (isRec) return;
            isRec = true;

            micBtn.classList.add('rec');
            waves.classList.add('on');
            dot.classList.remove('on');
            dot.classList.add('rec');
            stxt.textContent = 'يسمع...';
            micLabel.textContent = 'اتكلم بأي لغة';

            Object.values(recognizers).forEach(r => {
                try { r.start(); } catch (e) {}
            });

            log('بدء الاستماع', 'info');
        }

        function stop() {
            if (!isRec) return;
            isRec = false;

            micBtn.classList.remove('rec');
            waves.classList.remove('on');
            dot.classList.remove('rec');
            dot.classList.add('on');
            stxt.textContent = 'جاهز';
            micLabel.textContent = 'اضغط للتحدث';

            Object.values(recognizers).forEach(r => {
                try { r.stop(); } catch (e) {}
            });

            log('إيقاف الاستماع', 'info');
        }

        // ========== Init ==========
        async function init() {
            log('جاري التهيئة...', 'info');

            if (!checkBrowser()) return;

            const hasMic = await requestMicPermission();
            if (!hasMic) {
                micLabel.textContent = 'سمح بالوصول للميكروفون';
                return;
            }

            initRecognizers();

            micBtn.disabled = false;
            micLabel.textContent = 'اضغط للتحدث';
            dot.classList.add('on');
            stxt.textContent = 'جاهز';
            log('جاهز!', 'info');
        }

        // ========== Events ==========
        micBtn.onclick = () => {
            if (micBtn.disabled) return;
            isRec ? stop() : start();
        };

        permBtn.onclick = () => {
            requestMicPermission();
        };

        speakBtn.onclick = () => {
            if (lastSpoken && detectedLang) {
                speak(lastSpoken, LANG[detectedLang].to);
            }
        };

        // ========== Start ==========
        init();
    </script>
</body>
</html>
