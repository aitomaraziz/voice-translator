<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم الصوت التلقائي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 30px 0 20px;
        }

        .header h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #64ffda, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #8892b0;
            font-size: 14px;
        }

        /* Mode Selector */
        .mode-section {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #8892b0;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            border-color: #64ffda;
            background: rgba(100, 255, 218, 0.15);
            color: #64ffda;
        }

        /* Language Selector */
        .lang-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .lang-box {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lang-box label {
            display: block;
            font-size: 11px;
            color: #8892b0;
            margin-bottom: 8px;
        }

        .lang-box select {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .lang-box select option {
            background: #1a1a2e;
            color: #fff;
        }

        .swap-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64ffda, #4dd0b8);
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .swap-btn:hover {
            transform: scale(1.1) rotate(180deg);
        }

        /* Status */
        .status {
            text-align: center;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin: 15px 0;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff6b6b;
            margin-left: 8px;
            vertical-align: middle;
        }

        .status-dot.on {
            background: #64ffda;
            animation: blink 1.5s infinite;
        }

        .status-dot.listening {
            background: #ff6b6b;
            animation: pulse-dot 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        .status-text {
            font-size: 13px;
            color: #8892b0;
            vertical-align: middle;
        }

        /* Talk Button */
        .talk-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .talk-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #64ffda, #4dd0b8);
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 0 60px rgba(100, 255, 218, 0.4);
        }

        .talk-btn:hover {
            transform: scale(1.05);
        }

        .talk-btn.listening {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            box-shadow: 0 0 80px rgba(255, 107, 107, 0.6);
            animation: pulse-btn 1s infinite;
        }

        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .mic-icon {
            font-size: 60px;
        }

        .talk-label {
            margin-top: 20px;
            font-size: 16px;
            color: #8892b0;
        }

        .talk-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #5a6a8a;
        }

        /* Wave Animation */
        .wave-container {
            display: none;
            justify-content: center;
            gap: 4px;
            margin-top: 20px;
            height: 40px;
            align-items: center;
        }

        .wave-container.active {
            display: flex;
        }

        .wave-bar {
            width: 4px;
            height: 20px;
            background: #64ffda;
            border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 40px; }
        }

        /* Text Display */
        .text-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .text-card {
            background: rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            min-height: 80px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .text-card.original {
            border-right: 3px solid #64ffda;
        }

        .text-card.translated {
            border-left: 3px solid #ffd93d;
        }

        .text-card .label {
            font-size: 11px;
            color: #8892b0;
            margin-bottom: 8px;
        }

        .text-card .content {
            font-size: 20px;
            line-height: 1.6;
            color: #ccd6f6;
            word-wrap: break-word;
        }

        .text-card .play-btn {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 217, 61, 0.2);
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .text-card .play-btn:hover {
            background: rgba(255, 217, 61, 0.4);
        }

        .arrow {
            text-align: center;
            font-size: 20px;
            color: #64ffda;
        }

        /* History */
        .history-section {
            margin-top: 10px;
        }

        .history-title {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 10px;
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            border-right: 2px solid #64ffda;
        }

        .history-item .original {
            color: #8892b0;
            margin-bottom: 4px;
        }

        .history-item .translated {
            color: #ffd93d;
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: #5a6a8a;
            font-size: 11px;
        }

        @media (max-width: 400px) {
            .header h1 { font-size: 26px; }
            .talk-btn { width: 130px; height: 130px; }
            .mic-icon { font-size: 50px; }
            .text-card .content { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 مترجم الصوت التلقائي</h1>
            <p>يتكلم تلقائياً - يترجم فوراً - يشغّل الصوت</p>
        </div>

        <div class="mode-section">
            <button class="mode-btn active" id="autoMode" onclick="setMode('auto')">🔄 تلقائي</button>
            <button class="mode-btn" id="manualMode" onclick="setMode('manual')">🎤 يدوي</button>
        </div>

        <div class="lang-selector">
            <div class="lang-box">
                <label>لغتي</label>
                <select id="myLang">
                    <option value="ar" selected>العربية</option>
                    <option value="zh-CN">中文</option>
                    <option value="en">English</option>
                </select>
            </div>
            <button class="swap-btn" id="swapBtn">⇄</button>
            <div class="lang-box">
                <label>تترجم إلى</label>
                <select id="targetLang">
                    <option value="ar">العربية</option>
                    <option value="zh-CN" selected>中文</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">جاري التحقق...</span>
        </div>

        <div class="talk-area">
            <button class="talk-btn" id="talkBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="talk-label" id="talkLabel">جاهز للتحدث</div>
            <div class="talk-hint">اضغط على الزر أو مسافة في الكيبورد</div>
            <div class="wave-container" id="waveContainer">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <div class="text-section">
            <div class="text-card original">
                <div class="label" id="origLabel">ما قلته</div>
                <div class="content" id="origText">...</div>
            </div>
            <div class="arrow">↓</div>
            <div class="text-card translated">
                <div class="label" id="transLabel">الترجمة</div>
                <div class="content" id="transText">...</div>
                <button class="play-btn" id="playBtn" title="تشغيل الصوت">🔊</button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📝 آخر الترجمات</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            يعمل تلقائياً - ابدأ بالتحدث فوراً
        </div>
    </div>

    <script>
        // ========== State ==========
        let mode = 'auto'; // auto or manual
        let isListening = false;
        let recognition = null;
        let myLang = 'ar';
        let targetLang = 'zh-CN';
        let lastTranslation = '';
        let autoRestart = false;

        // ========== Elements ==========
        const talkBtn = document.getElementById('talkBtn');
        const origText = document.getElementById('origText');
        const transText = document.getElementById('transText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const myLangSelect = document.getElementById('myLang');
        const targetLangSelect = document.getElementById('targetLang');
        const swapBtn = document.getElementById('swapBtn');
        const playBtn = document.getElementById('playBtn');
        const talkLabel = document.getElementById('talkLabel');
        const waveContainer = document.getElementById('waveContainer');
        const historyList = document.getElementById('historyList');

        // ========== Check Browser ==========
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            statusText.textContent = 'المتصفح لا يدعم التعرف على الصوت - استخدم Chrome';
            talkBtn.disabled = true;
            talkBtn.style.opacity = '0.5';
        } else {
            statusDot.classList.add('on');
            statusText.textContent = 'جاهز - ابدأ بالتحدث';
            initRecognition();
        }

        // ========== Speech Recognition ==========
        function initRecognition() {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = myLang;

            recognition.onstart = () => {
                isListening = true;
                talkBtn.classList.add('listening');
                waveContainer.classList.add('active');
                statusDot.classList.remove('on');
                statusDot.classList.add('listening');
                talkLabel.textContent = 'جاري الاستماع...';
                statusText.textContent = 'أتكلم الآن...';
            };

            recognition.onend = () => {
                isListening = false;
                talkBtn.classList.remove('listening');
                waveContainer.classList.remove('active');
                statusDot.classList.remove('listening');
                statusDot.classList.add('on');
                talkLabel.textContent = 'جاهز للتحدث';
                statusText.textContent = 'جاهز - ابدأ بالتحدث';

                // Auto restart in auto mode
                if (autoRestart && mode === 'auto') {
                    setTimeout(() => {
                        startListening();
                    }, 300);
                }
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (interimTranscript) {
                    origText.textContent = interimTranscript;
                }

                if (finalTranscript) {
                    origText.textContent = finalTranscript;
                    translateText(finalTranscript);
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    statusText.textContent = 'يجب السماح بالوصول للميكروفون';
                    autoRestart = false;
                } else if (event.error === 'no-speech') {
                    statusText.textContent = 'لم يتم التقاط صوت...';
                } else {
                    statusText.textContent = 'خطأ: ' + event.error;
                }
                isListening = false;
                talkBtn.classList.remove('listening');
                waveContainer.classList.remove('active');
            };
        }

        // ========== Translation (Free API) ==========
        async function translateText(text) {
            if (!text.trim()) return;

            transText.textContent = 'جاري الترجمة...';

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${myLang}|${targetLang}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const translated = data.responseData.translatedText;
                    transText.textContent = translated;
                    lastTranslation = translated;
                    addToHistory(text, translated);
                    speakTranslation(translated);
                } else {
                    transText.textContent = 'خطأ في الترجمة';
                }
            } catch (err) {
                console.error('Translation error:', err);
                transText.textContent = 'تحقق من اتصال الإنترنت';
            }
        }

        // ========== Text to Speech ==========
        function speakTranslation(text) {
            if (!text) return;

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang;
            utterance.rate = 0.9;

            const voices = window.speechSynthesis.getVoices();
            const targetVoice = voices.find(v => v.lang.startsWith(targetLang.split('-')[0]));
            if (targetVoice) utterance.voice = targetVoice;

            window.speechSynthesis.speak(utterance);
        }

        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };

        // ========== Mode Control ==========
        function setMode(newMode) {
            mode = newMode;
            document.getElementById('autoMode').classList.toggle('active', mode === 'auto');
            document.getElementById('manualMode').classList.toggle('active', mode === 'manual');

            if (mode === 'auto') {
                autoRestart = true;
                startListening();
                talkLabel.textContent = 'يتحدث تلقائياً...';
            } else {
                autoRestart = false;
                stopListening();
                talkLabel.textContent = 'اضغط واثبت للتحدث';
            }
        }

        // ========== Listen Control ==========
        function startListening() {
            if (!recognition || isListening) return;
            try {
                recognition.lang = myLang;
                recognition.start();
            } catch (e) {
                console.error('Start error:', e);
            }
        }

        function stopListening() {
            if (!recognition) return;
            autoRestart = false;
            try {
                recognition.stop();
            } catch (e) {
                console.error('Stop error:', e);
            }
        }

        // ========== History ==========
        function addToHistory(original, translated) {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="original">${original}</div>
                <div class="translated">${translated}</div>
            `;
            historyList.insertBefore(item, historyList.firstChild);

            // Keep only last 10 items
            while (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        // ========== Event Listeners ==========
        talkBtn.addEventListener('click', () => {
            if (mode === 'manual') {
                if (isListening) {
                    stopListening();
                } else {
                    autoRestart = true;
                    startListening();
                }
            }
        });

        talkBtn.addEventListener('mousedown', () => {
            if (mode === 'manual') {
                autoRestart = true;
                startListening();
            }
        });

        talkBtn.addEventListener('mouseup', () => {
            if (mode === 'manual') {
                stopListening();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                if (mode === 'manual') {
                    autoRestart = true;
                    startListening();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                if (mode === 'manual') {
                    stopListening();
                }
            }
        });

        swapBtn.addEventListener('click', () => {
            const temp = myLangSelect.value;
            myLangSelect.value = targetLangSelect.value;
            targetLangSelect.value = temp;
            myLang = myLangSelect.value;
            targetLang = targetLangSelect.value;
            if (recognition) recognition.lang = myLang;

            const tempText = origText.textContent;
            origText.textContent = transText.textContent;
            transText.textContent = tempText;
        });

        myLangSelect.addEventListener('change', () => {
            myLang = myLangSelect.value;
            if (recognition) recognition.lang = myLang;
        });

        targetLangSelect.addEventListener('change', () => {
            targetLang = targetLangSelect.value;
        });

        playBtn.addEventListener('click', () => {
            if (lastTranslation) speakTranslation(lastTranslation);
        });

        // ========== Start Auto Mode ==========
        setTimeout(() => {
            if (SpeechRecognition) {
                setMode('auto');
            }
        }, 1000);
    </script>
</body>
</html>
