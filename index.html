<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم فوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d1b2a);
            min-height: 100vh;
            color: #fff;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 20px 0 10px;
        }

        .header h1 {
            font-size: 26px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        .dot.on { background: #00ff88; }
        .dot.rec { background: #ff4444; animation: blink 0.5s infinite; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text { font-size: 13px; color: #888; }

        .speakers {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .speaker {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .speaker.active { border-color: #00ff88; background: rgba(0, 255, 136, 0.1); }
        .speaker .emoji { font-size: 28px; }
        .speaker .name { font-size: 12px; color: #888; margin-top: 5px; }
        .speaker .lang { font-size: 16px; font-weight: 700; color: #00d4ff; }

        .mic-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .mic-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00d4ff, #0088cc);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
            position: relative;
        }

        .mic-btn:hover { transform: scale(1.05); }

        .mic-btn.rec {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            box-shadow: 0 0 60px rgba(255, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .mic-icon { font-size: 55px; }
        .mic-label { margin-top: 15px; font-size: 15px; color: #888; }

        .waves {
            display: none;
            justify-content: center;
            gap: 3px;
            margin-top: 15px;
            height: 35px;
            align-items: center;
        }

        .waves.on { display: flex; }

        .bar {
            width: 4px;
            height: 10px;
            background: #00ff88;
            border-radius: 2px;
            animation: wave 0.5s ease-in-out infinite;
        }

        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.08s; }
        .bar:nth-child(3) { animation-delay: 0.16s; }
        .bar:nth-child(4) { animation-delay: 0.24s; }
        .bar:nth-child(5) { animation-delay: 0.32s; }

        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 35px; }
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px;
            min-height: 60px;
            position: relative;
        }

        .card.src { border-right: 3px solid #00ff88; }
        .card.dst { border-left: 3px solid #ffd93d; }

        .card .tag { font-size: 10px; color: #666; margin-bottom: 5px; }
        .card .txt { font-size: 17px; line-height: 1.5; color: #ddd; }

        .card .speak-btn {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 217, 61, 0.2);
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .arrow { text-align: center; color: #00ff88; font-size: 18px; }

        .hist-title { font-size: 12px; color: #666; margin-bottom: 6px; }
        
        .hist-list { max-height: 100px; overflow-y: auto; }

        .hist-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 5px;
            font-size: 11px;
            border-right: 2px solid #00ff88;
        }

        .hist-item .h-src { color: #888; }
        .hist-item .h-dst { color: #ffd93d; }

        .footer {
            text-align: center;
            padding: 10px;
            color: #444;
            font-size: 10px;
        }

        .lang-indicator {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
        }

        .lang-chip {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(255,255,255,0.05);
            color: #666;
            transition: all 0.3s;
        }

        .lang-chip.ar { border: 1px solid #00ff88; color: #00ff88; }
        .lang-chip.zh { border: 1px solid #ffd93d; color: #ffd93d; }
        .lang-chip.en { border: 1px solid #00d4ff; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>⚡ مترجم فوري</h1>
        </div>

        <div class="status-bar">
            <div class="dot" id="dot"></div>
            <span class="status-text" id="stxt">جاهز - يسمع 3 لغات</span>
        </div>

        <div class="lang-indicator">
            <div class="lang-chip ar" id="arChip">🇸🇦 عربي</div>
            <div class="lang-chip zh" id="zhChip">🇨🇳 صيني</div>
            <div class="lang-chip en" id="enChip">🇺🇸 إنجليزي</div>
        </div>

        <div class="speakers">
            <div class="speaker" id="spk1">
                <div class="emoji">🎤</div>
                <div class="name">المتحدث</div>
                <div class="lang" id="spk1Lang">...</div>
            </div>
            <div class="speaker" id="spk2">
                <div class="emoji">🔊</div>
                <div class="name">الترجمة</div>
                <div class="lang" id="spk2Lang">...</div>
            </div>
        </div>

        <div class="mic-area">
            <button class="mic-btn" id="micBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="mic-label">اضغط وابدأ بالتحدث</div>
            <div class="waves" id="waves">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="cards">
            <div class="card src">
                <div class="tag">ما قلته</div>
                <div class="txt" id="srcTxt">...</div>
            </div>
            <div class="arrow">↓</div>
            <div class="card dst">
                <div class="tag">الترجمة</div>
                <div class="txt" id="dstTxt">...</div>
                <button class="speak-btn" id="speakBtn">🔊</button>
            </div>
        </div>

        <div class="hist-title">📝 آخر الترجمات</div>
        <div class="hist-list" id="histList"></div>

        <div class="footer">يسمع 3 لغات في نفس الوقت</div>
    </div>

    <script>
        // ========== Config ==========
        const LANG = {
            'ar': { name: 'العربية', flag: '🇸🇦', to: 'zh-CN', toName: '中文', toFlag: '🇨🇳' },
            'zh-CN': { name: '中文', flag: '🇨🇳', to: 'ar', toName: 'العربية', toFlag: '🇸🇦' },
            'en': { name: 'English', flag: '🇺🇸', to: 'ar', toName: 'العربية', toFlag: '🇸🇦' }
        };

        // ========== State ==========
        let isRec = false;
        let recognizers = {};
        let lastSpoken = '';
        let detectedLang = null;
        let isProcessing = false;

        // ========== Elements ==========
        const micBtn = document.getElementById('micBtn');
        const srcTxt = document.getElementById('srcTxt');
        const dstTxt = document.getElementById('dstTxt');
        const dot = document.getElementById('dot');
        const stxt = document.getElementById('stxt');
        const waves = document.getElementById('waves');
        const spk1 = document.getElementById('spk1');
        const spk2 = document.getElementById('spk2');
        const spk1Lang = document.getElementById('spk1Lang');
        const spk2Lang = document.getElementById('spk2Lang');
        const speakBtn = document.getElementById('speakBtn');
        const histList = document.getElementById('histList');
        const arChip = document.getElementById('arChip');
        const zhChip = document.getElementById('zhChip');
        const enChip = document.getElementById('enChip');

        // ========== Check Browser ==========
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            stxt.textContent = 'استخدم Chrome';
            micBtn.disabled = true;
        } else {
            dot.classList.add('on');
            stxt.textContent = 'جاهز - يسمع 3 لغات';
            initAllRec();
        }

        // ========== Init All Recognizers ==========
        function initAllRec() {
            ['ar', 'zh-CN', 'en'].forEach(lang => {
                const r = new SR();
                r.continuous = true;
                r.interimResults = true;
                r.lang = lang;
                r._lang = lang;

                r.onstart = () => {
                    updateLangChip(lang, true);
                };

                r.onresult = (event) => {
                    handleResult(event, lang);
                };

                r.onerror = (e) => {
                    if (e.error !== 'no-speech' && e.error !== 'aborted') {
                        console.log(`${lang} error: ${e.error}`);
                    }
                };

                r.onend = () => {
                    updateLangChip(lang, false);
                    if (isRec) {
                        setTimeout(() => {
                            try { r.start(); } catch (e) {}
                        }, 100);
                    }
                };

                recognizers[lang] = r;
            });
        }

        // ========== Update Language Chip ==========
        function updateLangChip(lang, active) {
            const chip = lang === 'ar' ? arChip : lang === 'zh-CN' ? zhChip : enChip;
            if (active) {
                chip.style.background = 'rgba(255,255,255,0.15)';
            } else {
                chip.style.background = 'rgba(255,255,255,0.05)';
            }
        }

        // ========== Handle Result ==========
        function handleResult(event, lang) {
            if (isProcessing) return;

            let finalText = '';
            let interimText = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const text = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalText += text;
                } else {
                    interimText += text;
                }
            }

            if (interimText) {
                srcTxt.textContent = interimText;
            }

            if (finalText && finalText.trim().length > 2) {
                isProcessing = true;
                detectedLang = lang;
                srcTxt.textContent = finalText;
                
                const config = LANG[lang];
                spk1Lang.textContent = config.name;
                spk2Lang.textContent = config.toName;
                stxt.textContent = `تم كشف: ${config.name}`;

                translate(finalText, lang, config.to);

                // Pause other recognizers briefly
                Object.keys(recognizers).forEach(key => {
                    if (key !== lang) {
                        try { recognizers[key].stop(); } catch (e) {}
                    }
                });

                setTimeout(() => {
                    isProcessing = false;
                    Object.keys(recognizers).forEach(key => {
                        if (isRec) {
                            try { recognizers[key].start(); } catch (e) {}
                        }
                    });
                }, 2000);
            }
        }

        // ========== Translate ==========
        async function translate(text, from, to) {
            dstTxt.textContent = 'جاري الترجمة...';

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const trans = data.responseData.translatedText;
                    dstTxt.textContent = trans;
                    lastSpoken = trans;
                    addHist(text, trans, LANG[from]?.flag, LANG[to]?.flag);
                    speak(trans, to);
                } else {
                    dstTxt.textContent = 'خطأ في الترجمة';
                }
            } catch (e) {
                dstTxt.textContent = 'تحقق من الإنترنت';
            }
        }

        // ========== Speak ==========
        function speak(text, lang) {
            if (!text) return;
            window.speechSynthesis.cancel();

            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.rate = 1;

            const voices = window.speechSynthesis.getVoices();
            const v = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (v) u.voice = v;

            window.speechSynthesis.speak(u);
        }

        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

        // ========== Start/Stop ==========
        function start() {
            if (isRec) return;
            isRec = true;
            
            micBtn.classList.add('rec');
            waves.classList.add('on');
            dot.classList.remove('on');
            dot.classList.add('rec');
            stxt.textContent = 'يسمع 3 لغات...';
            spk1.classList.add('active');

            Object.values(recognizers).forEach(r => {
                try { r.start(); } catch (e) {}
            });
        }

        function stop() {
            if (!isRec) return;
            isRec = false;

            micBtn.classList.remove('rec');
            waves.classList.remove('on');
            dot.classList.remove('rec');
            dot.classList.add('on');
            stxt.textContent = 'جاهز';
            spk1.classList.remove('active');

            Object.values(recognizers).forEach(r => {
                try { r.stop(); } catch (e) {}
            });
        }

        // ========== History ==========
        function addHist(src, dst, f1, f2) {
            const d = document.createElement('div');
            d.className = 'hist-item';
            d.innerHTML = `<div class="h-src">${f1} ${src}</div><div class="h-dst">${f2} ${dst}</div>`;
            histList.insertBefore(d, histList.firstChild);
            while (histList.children.length > 8) histList.removeChild(histList.lastChild);
        }

        // ========== Events ==========
        micBtn.onclick = () => isRec ? stop() : start();

        document.onkeydown = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                start();
            }
        };

        document.onkeyup = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                stop();
            }
        };

        speakBtn.onclick = () => {
            if (lastSpoken && detectedLang) {
                speak(lastSpoken, LANG[detectedLang].to);
            }
        };
    </script>
</body>
</html>
