<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم فوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d1b2a);
            min-height: 100vh;
            color: #fff;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header { text-align: center; padding: 15px 0; }
        .header h1 { font-size: 26px; background: linear-gradient(90deg, #00d4ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 12px; color: #666; margin-top: 5px; }

        /* Target Language Selector */
        .target-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
        }

        .target-label { font-size: 13px; color: #888; margin-bottom: 10px; }

        .target-btns { display: flex; gap: 10px; justify-content: center; }

        .target-btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #888;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .target-btn .emoji { font-size: 24px; display: block; margin-bottom: 5px; }

        .target-btn.active { border-color: #ffd93d; background: rgba(255, 217, 61, 0.15); color: #ffd93d; }

        /* Status */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot.on { background: #00ff88; }
        .dot.rec { background: #ff4444; animation: blink 0.5s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .status-text { font-size: 13px; color: #888; }

        /* Language rotation indicator */
        .rotation-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 5px 0;
        }

        .rot-lang {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            opacity: 0.4;
            transition: all 0.3s;
        }

        .rot-lang.active { opacity: 1; background: rgba(0, 212, 255, 0.2); color: #00d4ff; }

        /* Mic Button */
        .mic-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
        }

        .mic-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00d4ff, #0088cc);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
        }

        .mic-btn:hover { transform: scale(1.05); }

        .mic-btn.rec {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            box-shadow: 0 0 60px rgba(255, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .mic-icon { font-size: 60px; }
        .mic-label { margin-top: 15px; font-size: 16px; color: #888; text-align: center; }

        .waves { display: none; justify-content: center; gap: 3px; margin-top: 15px; height: 30px; align-items: center; }
        .waves.on { display: flex; }
        .bar { width: 4px; height: 10px; background: #00ff88; border-radius: 2px; animation: wave 0.5s ease-in-out infinite; }
        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.08s; }
        .bar:nth-child(3) { animation-delay: 0.16s; }
        .bar:nth-child(4) { animation-delay: 0.24s; }
        .bar:nth-child(5) { animation-delay: 0.32s; }
        @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 30px; } }

        /* Cards */
        .cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .card { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; min-height: 60px; position: relative; }
        .card.src { border-right: 3px solid #00ff88; }
        .card.dst { border-left: 3px solid #ffd93d; }
        .card .tag { font-size: 10px; color: #666; margin-bottom: 5px; }
        .card .txt { font-size: 17px; line-height: 1.5; color: #ddd; }
        .card .speak-btn { position: absolute; bottom: 10px; left: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 217, 61, 0.2); border: none; font-size: 14px; cursor: pointer; }
        .arrow { text-align: center; color: #00ff88; font-size: 18px; }

        .footer { text-align: center; padding: 10px; color: #444; font-size: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>⚡ مترجم فوري</h1>
            <p>يدور بين اللغات تلقائياً للكشف عن صوتك</p>
        </div>

        <div class="target-section">
            <div class="target-label">ترجم إلى:</div>
            <div class="target-btns">
                <button class="target-btn active" id="btnZh" onclick="setTarget('zh-CN')">
                    <span class="emoji">🇨🇳</span> صيني
                </button>
                <button class="target-btn" id="btnEn" onclick="setTarget('en')">
                    <span class="emoji">🇺🇸</span> إنجليزي
                </button>
                <button class="target-btn" id="btnAr" onclick="setTarget('ar')">
                    <span class="emoji">🇸🇦</span> عربي
                </button>
            </div>
        </div>

        <div class="rotation-indicator">
            <span class="rot-lang" id="rotAr">🇸🇦 عربي</span>
            <span class="rot-lang" id="rotZh">🇨🇳 صيني</span>
            <span class="rot-lang" id="rotEn">🇺🇸 إنجليزي</span>
        </div>

        <div class="status-bar">
            <div class="dot" id="dot"></div>
            <span class="status-text" id="stxt">جاهز</span>
        </div>

        <div class="mic-area">
            <button class="mic-btn" id="micBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="mic-label" id="micLabel">اضغط وابدأ بالتحدث</div>
            <div class="waves" id="waves">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="cards">
            <div class="card src">
                <div class="tag" id="srcTag">ما قلته</div>
                <div class="txt" id="srcTxt">...</div>
            </div>
            <div class="arrow">↓</div>
            <div class="card dst">
                <div class="tag" id="dstTag">الترجمة (صيني)</div>
                <div class="txt" id="dstTxt">...</div>
                <button class="speak-btn" id="speakBtn">🔊</button>
            </div>
        </div>

        <div class="footer">يدور تلقائياً بين عربي/صيني/إنجليزي للكشف</div>
    </div>

    <script>
        // ========== Config ==========
        const LANGS_LIST = ['ar', 'zh-CN', 'en'];
        const LANG = {
            'ar': { name: 'العربية', flag: '🇸🇦' },
            'zh-CN': { name: '中文', flag: '🇨🇳' },
            'en': { name: 'English', flag: '🇺🇸' }
        };

        // ========== State ==========
        let targetLang = 'zh-CN';
        let isRec = false;
        let rec = null;
        let currentSensorLang = 0; // index in LANGS_LIST
        let lastSpoken = '';
        let detectedLang = null;
        let sensorTimer = null;
        let speechTimeout = null;

        // ========== Elements ==========
        const micBtn = document.getElementById('micBtn');
        const micLabel = document.getElementById('micLabel');
        const srcTxt = document.getElementById('srcTxt');
        const dstTxt = document.getElementById('dstTxt');
        const srcTag = document.getElementById('srcTag');
        const dstTag = document.getElementById('dstTag');
        const dot = document.getElementById('dot');
        const stxt = document.getElementById('stxt');
        const waves = document.getElementById('waves');
        const speakBtn = document.getElementById('speakBtn');
        const btnZh = document.getElementById('btnZh');
        const btnEn = document.getElementById('btnEn');
        const btnAr = document.getElementById('btnAr');
        const rotAr = document.getElementById('rotAr');
        const rotZh = document.getElementById('rotZh');
        const rotEn = document.getElementById('rotEn');

        // ========== Check Browser ==========
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            stxt.textContent = 'استخدم Chrome';
            micBtn.disabled = true;
        } else {
            dot.classList.add('on');
        }

        // ========== Set Target ==========
        function setTarget(lang) {
            targetLang = lang;
            btnZh.classList.toggle('active', lang === 'zh-CN');
            btnEn.classList.toggle('active', lang === 'en');
            btnAr.classList.toggle('active', lang === 'ar');
            dstTag.textContent = `الترجمة (${LANG[lang].name})`;
        }

        // ========== Rotation Indicator ==========
        function updateRotation() {
            rotAr.classList.toggle('active', LANGS_LIST[currentSensorLang] === 'ar');
            rotZh.classList.toggle('active', LANGS_LIST[currentSensorLang] === 'zh-CN');
            rotEn.classList.toggle('active', LANGS_LIST[currentSensorLang] === 'en');
        }

        // ========== Init Recognizer ==========
        function initRec() {
            rec = new SR();
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = LANGS_LIST[currentSensorLang];

            rec.onstart = () => {
                // Keep listening
            };

            rec.onend = () => {
                // When it ends, rotate to next language and restart
                if (isRec) {
                    currentSensorLang = (currentSensorLang + 1) % LANGS_LIST.length;
                    updateRotation();
                    try { rec.start(); } catch (e) {}
                }
            };

            rec.onresult = (event) => {
                let finalText = '';
                let interimText = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalText += text;
                    } else {
                        interimText += text;
                    }
                }

                if (interimText) {
                    srcTxt.textContent = interimText;
                    // If we get interim results, this language is hearing something
                    clearTimeout(speechTimeout);
                    speechTimeout = setTimeout(() => {
                        // Keep sensor in the current language
                    }, 3000);
                }

                if (finalText && finalText.trim().length > 1) {
                    detectedLang = LANGS_LIST[currentSensorLang];
                    srcTxt.textContent = finalText;
                    srcTag.textContent = `ما قلته (${LANG[detectedLang].name})`;
                    stxt.textContent = `كشف: ${LANG[detectedLang].name}`;
                    translate(finalText, detectedLang, targetLang);
                }
            };

            rec.onerror = (e) => {
                // If no-speech or aborted, silently rotate
                if (e.error !== 'no-speech' && e.error !== 'aborted') {
                    stxt.textContent = `خطأ: ${e.error}`;
                }
            };
        }

        // ========== Translate ==========
        async function translate(text, from, to) {
            if (from === to) {
                dstTxt.textContent = text;
                lastSpoken = text;
                return;
            }

            dstTxt.textContent = 'جاري الترجمة...';

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const trans = data.responseData.translatedText;
                    dstTxt.textContent = trans;
                    lastSpoken = trans;
                    speak(trans, to);
                } else {
                    dstTxt.textContent = 'خطأ في الترجمة';
                }
            } catch (e) {
                dstTxt.textContent = 'تحقق من الإنترنت';
            }
        }

        // ========== Speak ==========
        function speak(text, lang) {
            if (!text) return;
            window.speechSynthesis.cancel();

            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.rate = 1;

            const voices = window.speechSynthesis.getVoices();
            const v = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (v) u.voice = v;

            window.speechSynthesis.speak(u);
        }

        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

        // ========== Start/Stop ==========
        function start() {
            if (isRec || !rec) return;
            isRec = true;

            currentSensorLang = 0;
            updateRotation();

            micBtn.classList.add('rec');
            waves.classList.add('on');
            dot.classList.remove('on');
            dot.classList.add('rec');
            stxt.textContent = 'يستمع... يدور بين اللغات';
            micLabel.textContent = 'اتكلم بأي لغة';

            try { rec.lang = LANGS_LIST[0]; rec.start(); } catch (e) {}
        }

        function stop() {
            if (!isRec || !rec) return;
            isRec = false;

            clearTimeout(speechTimeout);

            micBtn.classList.remove('rec');
            waves.classList.remove('on');
            dot.classList.remove('rec');
            dot.classList.add('on');
            stxt.textContent = 'جاهز';
            micLabel.textContent = 'اضغط للتحدث';

            try { rec.stop(); } catch (e) {}
        }

        // ========== Init ==========
        initRec();

        // ========== Events ==========
        micBtn.onclick = () => isRec ? stop() : start();

        document.onkeydown = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                start();
            }
        };

        document.onkeyup = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                stop();
            }
        };

        speakBtn.onclick = () => {
            if (lastSpoken) speak(lastSpoken, targetLang);
        };
    </script>
</body>
</html>
