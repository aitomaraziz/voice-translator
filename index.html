<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم فوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d1b2a);
            min-height: 100vh;
            color: #fff;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header { text-align: center; padding: 15px 0; }
        .header h1 { font-size: 26px; background: linear-gradient(90deg, #00d4ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Language Mode Selector */
        .lang-modes {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }

        .lang-mode {
            flex: 1;
            padding: 12px 8px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #888;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .lang-mode .emoji { font-size: 24px; display: block; margin-bottom: 5px; }

        .lang-mode.active {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }

        .lang-mode:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot.on { background: #00ff88; }
        .dot.rec { background: #ff4444; animation: blink 0.5s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .status-text { font-size: 13px; color: #888; }

        /* Info Box */
        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
            text-align: center;
        }

        .info-box p { font-size: 13px; color: #00d4ff; }

        /* Mic Button */
        .mic-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
        }

        .mic-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00d4ff, #0088cc);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
        }

        .mic-btn:hover { transform: scale(1.05); }

        .mic-btn.rec {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            box-shadow: 0 0 60px rgba(255, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }

        .mic-btn:disabled {
            background: #333;
            cursor: not-allowed;
            box-shadow: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .mic-icon { font-size: 55px; }
        .mic-label { margin-top: 12px; font-size: 15px; color: #888; text-align: center; }

        .waves { display: none; justify-content: center; gap: 3px; margin-top: 12px; height: 30px; align-items: center; }
        .waves.on { display: flex; }
        .bar { width: 4px; height: 10px; background: #00ff88; border-radius: 2px; animation: wave 0.5s ease-in-out infinite; }
        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.08s; }
        .bar:nth-child(3) { animation-delay: 0.16s; }
        .bar:nth-child(4) { animation-delay: 0.24s; }
        .bar:nth-child(5) { animation-delay: 0.32s; }
        @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 30px; } }

        /* Cards */
        .cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .card { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; min-height: 60px; position: relative; }
        .card.src { border-right: 3px solid #00ff88; }
        .card.dst { border-left: 3px solid #ffd93d; }
        .card .tag { font-size: 10px; color: #666; margin-bottom: 5px; }
        .card .txt { font-size: 17px; line-height: 1.5; color: #ddd; }
        .card .speak-btn { position: absolute; bottom: 10px; left: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 217, 61, 0.2); border: none; font-size: 14px; cursor: pointer; }
        .arrow { text-align: center; color: #00ff88; font-size: 18px; }

        .footer { text-align: center; padding: 10px; color: #444; font-size: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>⚡ مترجم فوري</h1>
        </div>

        <div class="lang-modes">
            <button class="lang-mode active" id="modeAr" onclick="setMode('ar')">
                <span class="emoji">🇸🇦</span>
                أتحدث عربي
            </button>
            <button class="lang-mode" id="modeZh" onclick="setMode('zh-CN')">
                <span class="emoji">🇨🇳</span>
                أتحدث صيني
            </button>
            <button class="lang-mode" id="modeEn" onclick="setMode('en')">
                <span class="emoji">🇺🇸</span>
                أتحدث إنجليزي
            </button>
        </div>

        <div class="status-bar">
            <div class="dot" id="dot"></div>
            <span class="status-text" id="stxt">جاهز</span>
        </div>

        <div class="info-box">
            <p>اختر لغتك → اضغط الميكروفون → تحدث ← يترجم تلقائياً</p>
        </div>

        <div class="mic-area">
            <button class="mic-btn" id="micBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="mic-label" id="micLabel">اضغط للتحدث</div>
            <div class="waves" id="waves">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="cards">
            <div class="card src">
                <div class="tag" id="srcTag">ما قلته (عربي)</div>
                <div class="txt" id="srcTxt">...</div>
            </div>
            <div class="arrow">↓</div>
            <div class="card dst">
                <div class="tag" id="dstTag">الترجمة (صيني)</div>
                <div class="txt" id="dstTxt">...</div>
                <button class="speak-btn" id="speakBtn">🔊</button>
            </div>
        </div>

        <div class="footer">اختر لغتك وابدأ بالتحدث</div>
    </div>

    <script>
        // ========== Config ==========
        const LANG = {
            'ar': { name: 'العربية', flag: '🇸🇦', to: 'zh-CN', toName: '中文', toFlag: '🇨🇳' },
            'zh-CN': { name: '中文', flag: '🇨🇳', to: 'ar', toName: 'العربية', toFlag: '🇸🇦' },
            'en': { name: 'English', flag: '🇺🇸', to: 'ar', toName: 'العربية', toFlag: '🇸🇦' }
        };

        // ========== State ==========
        let currentMode = 'ar';
        let isRec = false;
        let rec = null;
        let lastSpoken = '';

        // ========== Elements ==========
        const micBtn = document.getElementById('micBtn');
        const micLabel = document.getElementById('micLabel');
        const srcTxt = document.getElementById('srcTxt');
        const dstTxt = document.getElementById('dstTxt');
        const srcTag = document.getElementById('srcTag');
        const dstTag = document.getElementById('dstTag');
        const dot = document.getElementById('dot');
        const stxt = document.getElementById('stxt');
        const waves = document.getElementById('waves');
        const speakBtn = document.getElementById('speakBtn');
        const modeAr = document.getElementById('modeAr');
        const modeZh = document.getElementById('modeZh');
        const modeEn = document.getElementById('modeEn');

        // ========== Check Browser ==========
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            stxt.textContent = 'استخدم Chrome';
            micBtn.disabled = true;
            micLabel.textContent = 'المتصفح لا يدعم这项功能';
        } else {
            dot.classList.add('on');
            stxt.textContent = 'جاهز';
        }

        // ========== Set Language Mode ==========
        function setMode(lang) {
            currentMode = lang;
            
            // Update UI
            modeAr.classList.toggle('active', lang === 'ar');
            modeZh.classList.toggle('active', lang === 'zh-CN');
            modeEn.classList.toggle('active', lang === 'en');

            const config = LANG[lang];
            srcTag.textContent = `ما قلته (${config.name})`;
            dstTag.textContent = `الترجمة (${config.toName})`;

            // Update recognizer
            if (rec) {
                rec.lang = lang;
            }

            // Reset texts
            srcTxt.textContent = '...';
            dstTxt.textContent = '...';
        }

        // ========== Init Recognizer ==========
        function initRec() {
            rec = new SR();
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = currentMode;

            rec.onstart = () => {
                isRec = true;
                micBtn.classList.add('rec');
                waves.classList.add('on');
                dot.classList.remove('on');
                dot.classList.add('rec');
                stxt.textContent = 'أستمع...';
                micLabel.textContent = 'اتكلم الآن';
            };

            rec.onend = () => {
                isRec = false;
                micBtn.classList.remove('rec');
                waves.classList.remove('on');
                dot.classList.remove('rec');
                dot.classList.add('on');
                stxt.textContent = 'جاهز';
                micLabel.textContent = 'اضغط للتحدث';
            };

            rec.onresult = (event) => {
                let finalText = '';
                let interimText = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalText += text;
                    } else {
                        interimText += text;
                    }
                }

                if (interimText) srcTxt.textContent = interimText;

                if (finalText && finalText.trim().length > 1) {
                    srcTxt.textContent = finalText;
                    translate(finalText);
                }
            };

            rec.onerror = (e) => {
                if (e.error === 'no-speech') {
                    stxt.textContent = 'لم أسمع صوتاً';
                } else if (e.error === 'not-allowed') {
                    stxt.textContent = 'سمح بالوصول للميكروفون';
                } else {
                    stxt.textContent = `خطأ: ${e.error}`;
                }
                isRec = false;
                micBtn.classList.remove('rec');
                waves.classList.remove('on');
            };
        }

        // ========== Translate ==========
        async function translate(text) {
            const from = currentMode;
            const to = LANG[from].to;
            
            dstTxt.textContent = 'جاري الترجمة...';

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const trans = data.responseData.translatedText;
                    dstTxt.textContent = trans;
                    lastSpoken = trans;
                    speak(trans, to);
                } else {
                    dstTxt.textContent = 'خطأ في الترجمة';
                }
            } catch (e) {
                dstTxt.textContent = 'تحقق من الإنترنت';
            }
        }

        // ========== Speak ==========
        function speak(text, lang) {
            if (!text) return;
            window.speechSynthesis.cancel();

            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.rate = 1;

            const voices = window.speechSynthesis.getVoices();
            const v = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (v) u.voice = v;

            window.speechSynthesis.speak(u);
        }

        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

        // ========== Start/Stop ==========
        function start() {
            if (isRec || !rec) return;
            try { rec.start(); } catch (e) {}
        }

        function stop() {
            if (!isRec || !rec) return;
            try { rec.stop(); } catch (e) {}
        }

        // ========== Init ==========
        initRec();
        setMode('ar');

        // ========== Events ==========
        micBtn.onclick = () => isRec ? stop() : start();

        document.onkeydown = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                start();
            }
        };

        document.onkeyup = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                stop();
            }
        };

        speakBtn.onclick = () => {
            if (lastSpoken) {
                const to = LANG[currentMode].to;
                speak(lastSpoken, to);
            }
        };
    </script>
</body>
</html>
