<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم فوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d1b2a);
            min-height: 100vh;
            color: #fff;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header { text-align: center; padding: 15px 0; }
        .header h1 { font-size: 26px; background: linear-gradient(90deg, #00d4ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 12px; color: #666; margin-top: 5px; }

        /* UI Language Switcher */
        .ui-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 5px 0 10px;
        }

        .ui-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #888;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .ui-btn.active { border-color: #00d4ff; background: rgba(0, 212, 255, 0.15); color: #00d4ff; }

        /* Language Selectors */
        .lang-select {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-select .box { flex: 1; text-align: center; }
        .lang-select .label { font-size: 11px; color: #888; margin-bottom: 8px; }

        .lang-select select {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            text-align: center;
        }

        .lang-select select option { background: #1a1a3e; color: #fff; }

        .lang-select .swap-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0088cc);
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .lang-select .swap-btn:hover { transform: scale(1.1) rotate(180deg); }

        /* Status */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot.on { background: #00ff88; }
        .dot.rec { background: #ff4444; animation: blink 0.5s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .status-text { font-size: 13px; color: #888; }

        /* Mic Button */
        .mic-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
        }

        .mic-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00d4ff, #0088cc);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
        }

        .mic-btn:hover { transform: scale(1.05); }

        .mic-btn.rec {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            box-shadow: 0 0 60px rgba(255, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .mic-icon { font-size: 60px; }
        .mic-label { margin-top: 15px; font-size: 16px; color: #888; text-align: center; }

        .waves { display: none; justify-content: center; gap: 3px; margin-top: 15px; height: 30px; align-items: center; }
        .waves.on { display: flex; }
        .bar { width: 4px; height: 10px; background: #00ff88; border-radius: 2px; animation: wave 0.5s ease-in-out infinite; }
        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.08s; }
        .bar:nth-child(3) { animation-delay: 0.16s; }
        .bar:nth-child(4) { animation-delay: 0.24s; }
        .bar:nth-child(5) { animation-delay: 0.32s; }
        @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 30px; } }

        /* Cards */
        .cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .card { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; min-height: 60px; position: relative; }
        .card.src { border-right: 3px solid #00ff88; }
        .card.dst { border-left: 3px solid #ffd93d; }
        .card .tag { font-size: 10px; color: #666; margin-bottom: 5px; }
        .card .txt { font-size: 17px; line-height: 1.5; color: #ddd; }
        .card .speak-btn { position: absolute; bottom: 10px; left: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 217, 61, 0.2); border: none; font-size: 14px; cursor: pointer; }
        .arrow { text-align: center; color: #00ff88; font-size: 18px; }

        /* Start Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 26, 0.98);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.4s;
        }

        .overlay.hidden { opacity: 0; pointer-events: none; }

        .overlay .big-mic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00d4ff, #0088cc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.5);
            animation: pulse 1.5s infinite;
            cursor: pointer;
        }

        .overlay .start-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .overlay .start-sub {
            font-size: 14px;
            color: #888;
            padding: 0 30px;
            text-align: center;
        }

        .overlay .start-btn {
            padding: 14px 40px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            color: #0a0a1a;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .overlay .start-btn:hover { transform: scale(1.05); }

        /* History */
        .hist-title { font-size: 12px; color: #666; margin-bottom: 6px; }
        .hist-list { max-height: 90px; overflow-y: auto; }
        .hist-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 7px;
            margin-bottom: 5px;
            font-size: 11px;
            border-right: 2px solid #00ff88;
        }
        .hist-item .h-src { color: #888; }
        .hist-item .h-dst { color: #ffd93d; }

        .footer { text-align: center; padding: 10px; color: #444; font-size: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1 id="appTitle">⚡ مترجم فوري</h1>
            <p data-i18n="subtitle">ترجمة صوتية تلقائية فورية</p>
        </div>

        <!-- UI Language Switcher -->
        <div class="ui-switch">
            <button class="ui-btn" id="uiAr" onclick="setUI('ar')">العربية</button>
            <button class="ui-btn" id="uiZh" onclick="setUI('zh')">中文</button>
            <button class="ui-btn" id="uiEn" onclick="setUI('en')">English</button>
        </div>

        <!-- Language Selectors -->
        <div class="lang-select">
            <div class="box">
                <div class="label" data-i18n="speakLabel">أنا أتحدث</div>
                <select id="srcSelect">
                    <option value="ar" selected>🇸🇦 العربية</option>
                    <option value="zh-CN">🇨🇳 中文</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
            <button class="swap-btn" id="swapBtn">⇄</button>
            <div class="box">
                <div class="label" data-i18n="trLabel">ترجم إلى</div>
                <select id="dstSelect">
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="zh-CN" selected>🇨🇳 中文</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
        </div>

        <div class="status-bar">
            <div class="dot" id="dot"></div>
            <span class="status-text" id="stxt" data-i18n="ready">جاهز</span>
        </div>

        <div class="mic-area">
            <button class="mic-btn" id="micBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="mic-label" id="micLabel" data-i18n="tapStart">اضغط للبدء بالتحدث</div>
            <div class="waves" id="waves">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="cards">
            <div class="card src">
                <div class="tag" id="srcTag" data-i18n="saidTag">ما قلته</div>
                <div class="txt" id="srcTxt">...</div>
            </div>
            <div class="arrow">↓</div>
            <div class="card dst">
                <div class="tag" id="dstTag" data-i18n="trTag">الترجمة</div>
                <div class="txt" id="dstTxt">...</div>
                <button class="speak-btn" id="speakBtn" title="🔊">🔊</button>
            </div>
        </div>

        <div class="hist-title" data-i18n="histTitle">📝 آخر الترجمات</div>
        <div class="hist-list" id="histList"></div>

        <div class="footer" data-i18n="footer">تحدث بقولك التلقائي - الترجمة فورية</div>
    </div>

    <!-- Start Overlay (first tap required by browser for mic) -->
    <div class="overlay" id="startOverlay">
        <div class="big-mic" id="bigMic">🎤</div>
        <div class="start-title" data-i18n="startTitle">ترجمة صوتية تلقائية</div>
        <div class="start-sub" data-i18n="startSub">اضغط للسماح بالميكروفون وسأستمع باستمرار وأترجم فورياً بكل اللغات</div>
        <button class="start-btn" id="startBtn" data-i18n="startBtn">ابدأ الآن 🚀</button>
    </div>

    <script>
        // ========== Translations ==========
        const I18N = {
            ar: {
                appTitle: '⚡ مترجم فوري',
                subtitle: 'ترجمة صوتية تلقائية فورية',
                speakLabel: 'أنا أتحدث',
                trLabel: 'ترجم إلى',
                ready: 'جاهز',
                tapStart: 'اضغط للبدء بالتحدث',
                saidTag: 'ما قلته',
                trTag: 'الترجمة',
                histTitle: '📝 آخر الترجمات',
                footer: 'تحدث - الترجمة فورية',
                listening: 'أستمع...',
                speakNow: 'اتكلم الآن',
                noSpeech: 'لم أسمع صوتاً',
                useChrome: 'استخدم Chrome',
                useEdge: 'استخدم Microsoft Edge للصوت العصبي',
                micDenied: 'تم رفض الميكروفون',
                translating: 'جاري الترجمة...',
                transError: 'خطأ في الترجمة',
                transNoNet: 'تحقق من الإنترنت',
                autoOn: 'الوضع التلقائي مفعل',
                startTitle: 'ترجمة صوتية تلقائية',
                startSub: 'اضغط للسماح بالميكروفون وسأستمع باستمرار وأترجم فورياً بكل اللغات',
                startBtn: 'ابدأ الآن 🚀',
                starting: 'جارٍ التشغيل...',
                started: 'يعمل تلقائياً - تحدث الآن'
            },
            zh: {
                appTitle: '⚡ 即时翻译',
                subtitle: '自动语音翻译',
                speakLabel: '我说',
                trLabel: '翻译为',
                ready: '准备就绪',
                tapStart: '点击开始说话',
                saidTag: '我所说',
                trTag: '翻译',
                histTitle: '📝 最近翻译',
                footer: '说话 - 立即翻译',
                listening: '正在聆听...',
                speakNow: '请说话',
                noSpeech: '未听到声音',
                useChrome: '请使用 Chrome',
                useEdge: '请在 Edge 浏览器打开以获得神经语音',
                micDenied: '麦克风被拒绝',
                translating: '正在翻译...',
                transError: '翻译错误',
                transNoNet: '检查互联网',
                autoOn: '自动模式已开启',
                startTitle: '自动语音翻译',
                startSub: '点击允许麦克风，我会持续聆听并即时翻译',
                startBtn: '立即开始 🚀',
                starting: '正在启动...',
                started: '全自动运行 - 请说话'
            },
            en: {
                appTitle: '⚡ Instant Translator',
                subtitle: 'Automatic instant voice translation',
                speakLabel: 'I speak',
                trLabel: 'Translate to',
                ready: 'Ready',
                tapStart: 'Tap to start speaking',
                saidTag: 'What I said',
                trTag: 'Translation',
                histTitle: '📝 Recent translations',
                footer: 'Speak - instant translation',
                listening: 'Listening...',
                speakNow: 'Speak now',
                noSpeech: 'No speech detected',
                useChrome: 'Use Chrome',
                useEdge: 'Open in Microsoft Edge for neural voice',
                micDenied: 'Microphone denied',
                translating: 'Translating...',
                transError: 'Translation error',
                transNoNet: 'Check internet',
                autoOn: 'Auto mode enabled',
                startTitle: 'Automatic Voice Translation',
                startSub: 'Click to allow the mic - I will listen continuously and translate instantly',
                startBtn: 'Start now 🚀',
                starting: 'Starting...',
                started: 'Running automatically - speak now'
            }
        };

        // ========== Config ==========
        const LANG = {
            'ar': { name: 'العربية', flag: '🇸🇦' },
            'zh-CN': { name: '中文', flag: '🇨🇳' },
            'en': { name: 'English', flag: '🇺🇸' }
        };

        // ========== State ==========
        let uiLang = 'ar';
        let srcLang = 'ar';
        let dstLang = 'zh-CN';
        let isRec = false;
        let rec = null;
        let lastSpoken = '';
        let voices = [];
        let lastFinalText = '';
        let lastTranslated = '';
        let debounceTimer = null;
        let autoListen = false; // continuous listening

        // ========== Elements ==========
        const micBtn = document.getElementById('micBtn');
        const micLabel = document.getElementById('micLabel');
        const srcTxt = document.getElementById('srcTxt');
        const dstTxt = document.getElementById('dstTxt');
        const srcTag = document.getElementById('srcTag');
        const dstTag = document.getElementById('dstTag');
        const dot = document.getElementById('dot');
        const stxt = document.getElementById('stxt');
        const waves = document.getElementById('waves');
        const speakBtn = document.getElementById('speakBtn');
        const srcSelect = document.getElementById('srcSelect');
        const dstSelect = document.getElementById('dstSelect');
        const swapBtn = document.getElementById('swapBtn');
        const appTitle = document.getElementById('appTitle');
        const uiAr = document.getElementById('uiAr');
        const uiZh = document.getElementById('uiZh');
        const uiEn = document.getElementById('uiEn');
        const histList = document.getElementById('histList');

        // ========== Set UI Language ==========
        function setUI(lang) {
            uiLang = lang;
            const t = I18N[lang];
            appTitle.textContent = t.appTitle;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t[key] || el.textContent;
            });
            uiAr.classList.toggle('active', lang === 'ar');
            uiZh.classList.toggle('active', lang === 'zh');
            uiEn.classList.toggle('active', lang === 'en');
            updateLabels();
        }

        // ========== Update Labels ==========
        function updateLabels() {
            srcTag.textContent = `${I18N[uiLang].saidTag} (${LANG[srcLang].name})`;
            dstTag.textContent = `${I18N[uiLang].trTag} (${LANG[dstLang].name})`;
        }

        // ========== Check Browser ==========
        const IS_EDGE = /Edg\//.test(navigator.userAgent);
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            stxt.textContent = I18N[uiLang].useChrome;
            micBtn.disabled = true;
        } else {
            dot.classList.add('on');
        }

        // ========== Load Voices (cached for speed) ==========
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                stxt.textContent = I18N[uiLang].ready + ' · ' + voices.length + ' 🎙️';
            }
        }

        function ensureVoices() {
            loadVoices();
            // Some browsers load voices asynchronously - retry a few times
            let retries = 0;
            const interval = setInterval(() => {
                retries++;
                loadVoices();
                if (voices.length > 0 || retries > 10) clearInterval(interval);
            }, 300);
        }

        if (window.speechSynthesis) {
            ensureVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                loadVoices();
            };
        }

        // ========== Init Recognizer ==========
        function initRec() {
            rec = new SR();
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 1;
            rec.lang = srcLang;

            rec.onstart = () => {
                isRec = true;
                micBtn.classList.add('rec');
                waves.classList.add('on');
                dot.classList.remove('on');
                dot.classList.add('rec');
                stxt.textContent = I18N[uiLang].listening;
                micLabel.textContent = I18N[uiLang].speakNow;
            };

            rec.onend = () => {
                // Auto-restart for continuous listening if still in auto mode
                if (autoListen) {
                    setTimeout(() => {
                        try { rec.start(); } catch (e) {}
                    }, 150);
                    return;
                }
                isRec = false;
                micBtn.classList.remove('rec');
                waves.classList.remove('on');
                dot.classList.remove('rec');
                dot.classList.add('on');
                stxt.textContent = I18N[uiLang].ready;
                micLabel.textContent = I18N[uiLang].tapStart;
            };

            rec.onresult = (event) => {
                let finalText = '';
                let interimText = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalText += text;
                    } else {
                        interimText += text;
                    }
                }

                // Show interim live (fast feedback)
                if (interimText) {
                    srcTxt.textContent = interimText;
                }

                if (finalText && finalText.trim().length > 1 && finalText.trim() !== lastFinalText) {
                    lastFinalText = finalText.trim();
                    srcTxt.textContent = finalText;
                    // Translate immediately - no delay
                    translate(finalText, srcLang, dstLang);
                }
            };

            rec.onerror = (e) => {
                if (e.error === 'no-speech') {
                    // Keep silent - just status
                    if (!autoListen || !isRec) stxt.textContent = I18N[uiLang].noSpeech;
                } else if (e.error === 'not-allowed') {
                    stxt.textContent = I18N[uiLang].micDenied;
                    autoListen = false;
                }
            };
        }

        // ========== Translate (fast) ==========
        async function translate(text, from, to) {
            if (from === to) {
                dstTxt.textContent = text;
                lastSpoken = text;
                lastTranslated = text;
                return;
            }

            dstTxt.textContent = I18N[uiLang].translating;

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const trans = data.responseData.translatedText;
                    dstTxt.textContent = trans;
                    lastTranslated = trans;
                    lastSpoken = text;
                    addHist(text, trans, from, to);
                    // Play immediately
                    speak(trans, to);
                } else {
                    dstTxt.textContent = I18N[uiLang].transError;
                }
            } catch (e) {
                dstTxt.textContent = I18N[uiLang].transNoNet;
            }
        }

        // ========== Speak (local voices, no Google) ==========
        function pickVoice(lang) {
            if (voices.length === 0) loadVoices();

            const prefix = lang.split('-')[0];

            // 1) Exact language match
            let v = voices.find(v => v.lang.toLowerCase() === lang.toLowerCase());
            if (v) return v;

            // 2) Language prefix match
            v = voices.find(v => v.lang.toLowerCase().startsWith(prefix));
            if (v) return v;

            // 3) Arabic: try common Arabic voice names
            if (prefix === 'ar') {
                const arCandidates = voices.filter(v => {
                    const l = v.lang.toLowerCase();
                    return l.startsWith('ar') || v.name.toLowerCase().includes('arabic') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('salma');
                });
                if (arCandidates.length > 0) return arCandidates[0];
            }

            // 4) Chinese / English fallbacks
            if (prefix === 'zh') {
                const zhCandidates = voices.filter(v => v.lang.toLowerCase().startsWith('zh'));
                if (zhCandidates.length > 0) return zhCandidates[0];
            }
            if (prefix === 'en') {
                const enCandidates = voices.filter(v => v.lang.toLowerCase().startsWith('en'));
                if (enCandidates.length > 0) return enCandidates[0];
            }

            return null;
        }

        // ===== Edge TTS (Microsoft neural voices - free, no key, ar/zh/en) =====
        const EDGE_TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';
        const EDGE_WSS = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1';
        // Reference implementation (voipi / rany2 edge-tts): the WINDOWS ticks value
        // exceeds 2^53, so it MUST be computed with BigInt to stay exact, otherwise
        // the SHA-256 token mismatches and the server closes the socket silently.
        async function edgeSecGec() {
            const epochSec = BigInt(Math.floor(Date.now() / 1000) + 11644473600);
            const ticks = epochSec * 10000000n;                       // Windows file time
            const rounded = ticks - (ticks % 3000000000n);            // 5-minute domain
            const data = new TextEncoder().encode(`${rounded}${EDGE_TOKEN}`);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        const EDGE_VOICES = {
            en: ['en-US-AriaNeural', 'en-GB-SoniaNeural'],
            zh: ['zh-CN-XiaoxiaoNeural', 'zh-CN-YunxiNeural'],
            ar: ['ar-SA-HamedNeural', 'ar-EG-SalmaNeural', 'ar-EG-ShakirNeural', 'ar-AE-FatimaNeural', 'ar-SY-AmanyNeural']
        };

        // Try each candidate voice until one actually produces audio.
        async function edgeSpeak(text, lang) {
            const prefix = (lang || '').split('-')[0] || 'en';
            const voices = EDGE_VOICES[prefix] || ['en-US-AriaNeural'];
            for (const voice of voices) {
                const ok = await edgeOne(text, lang, voice);
                if (ok) return true;
            }
            return false;
        }

        function rndHex(len) {
            let s = '';
            while (s.length < len) { try { s += Math.random().toString(16).slice(2); } catch (e) { s += '0'.repeat(len); } }
            return s.slice(0, len);
        }

        // One WebSocket attempt with a specific voice.
        // resolve(true) only when real audio bytes were received and started playing.
        function edgeOne(text, lang, voice) {
            return new Promise((resolve) => {
                const reqId = rndHex(20);
                const connId = rndHex(20);
                const SEP = new TextEncoder().encode('Path:audio\r\n');

                edgeSecGec().then((sec) => {
                    const url = `${EDGE_WSS}?TrustedClientToken=${EDGE_TOKEN}&Sec-MS-GEC=${sec}&Sec-MS-GEC-Version=1-143.0.3650.75&ConnectionId=${connId}`;
                    const chunks = [];
                    let ws = null;
                    let settled = false;      // final answer given
                    let startedPlay = false;  // playback attempted once
                    let timeout = null;

                    const finish = (val) => {
                        if (settled) return;
                        settled = true;
                        if (timeout) clearTimeout(timeout);
                        try { ws && ws.close(); } catch (e) {}
                        resolve(val);
                    };

                    const ensurePlay = () => {
                        if (startedPlay) return;
                        if (!chunks.length) { finish(false); return; }
                        startedPlay = true;
                        playChunks(chunks).then(finish);
                    };

                    try {
                        ws = new WebSocket(url);
                    } catch (e) { finish(false); return; }

                    timeout = setTimeout(ensurePlay, 15000);

                    ws.onopen = () => {
                        try {
                            ws.send('X-Timestamp:' + new Date().toString() + '\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n' +
                                '{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":false,"wordBoundaryEnabled":true},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}');
                            ws.send('X-RequestId:' + reqId + '\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:' + new Date().toString() + '\r\nPath:ssml\r\n\r\n' +
                                '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="' + lang + '"><voice name="' + voice + '"><prosody rate="0%" pitch="0%">' +
                                text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') +
                                '</prosody></voice></speak>');
                        } catch (e) { finish(false); }
                    };

                    ws.onmessage = (ev) => {
                        if (typeof ev.data === 'string') {
                            if (ev.data.includes('Path:turn.end')) ensurePlay();
                            return;
                        }
                        const reader = new FileReader();
                        reader.onload = () => {
                            const buf = new Uint8Array(reader.result);
                            const idx = indexOfBytes(buf, SEP);
                            if (idx !== -1) chunks.push(buf.slice(idx + SEP.length));
                        };
                        try { reader.readAsArrayBuffer(ev.data); } catch (e) {}
                    };

                    ws.onerror = () => ensurePlay();
                    ws.onclose = () => ensurePlay();
                }).catch(() => resolve(false));
            });
        }

        // Play accumulated mp3 chunks via an <audio> element.
        // Resolves true once playback actually started.
        function playChunks(chunks) {
            return new Promise((resolve) => {
                const blob = new Blob(chunks, { type: 'audio/mpeg' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('audio');
                a.src = url;
                a.volume = 1;
                let settled = false;
                const settle = (v) => { if (!settled) { settled = true; try { URL.revokeObjectURL(url); } catch (e) {} resolve(v); } };
                a.onplaying = () => { stxt.textContent = '🔊 Edge'; settle(true); };
                a.onended = () => settle(true);
                a.onerror = () => settle(false);
                a.play().catch(() => settle(false));
            });
        }

        function indexOfBytes(arr, sub) {
            for (let i = 0; i <= arr.length - sub.length; i++) {
                let match = true;
                for (let j = 0; j < sub.length; j++) {
                    if (arr[i + j] !== sub[j]) { match = false; break; }
                }
                if (match) return i;
            }
            return -1;
        }

        async function speak(text, lang) {
            if (!text) return;
            try { window.speechSynthesis.cancel(); } catch (e) {}

            const prefix = lang.split('-')[0];
            const short = text.replace(/[^\p{L}\p{N}\s.,!?;:]/gu, '').slice(0, 180);
            if (!short.trim()) return;

            // 1) Microsoft Edge TTS (free, no key, natural Arabic/Chinese/English).
            const played = await edgeSpeak(short, lang);
            if (played) return;

            // 2) Fallback - local browser voice if Edge failed.
            const v = pickVoice(lang);
            if (v) {
                stxt.textContent = '🔊 Local';
                const u = new SpeechSynthesisUtterance(short);
                u.lang = v.lang;
                u.rate = 1;
                u.voice = v;
                window.speechSynthesis.speak(u);
            } else {
                stxt.textContent = '🔇 ' + prefix.toUpperCase() + (IS_EDGE ? '' : ' · ' + I18N[uiLang].useEdge);
            }
        }

        // ========== Start/Stop (continuous) ==========
        function start() {
            if (isRec || !rec) return;
            autoListen = true;
            try {
                rec.lang = srcLang;
                rec.start();
            } catch (e) {}
            stxt.textContent = I18N[uiLang].autoOn;
        }

        function stop() {
            autoListen = false;
            if (!isRec || !rec) return;
            try { rec.stop(); } catch (e) {}
        }

        // ========== History ==========
        function addHist(src, dst, from, to) {
            const f1 = LANG[from]?.flag || '';
            const f2 = LANG[to]?.flag || '';
            const item = document.createElement('div');
            item.className = 'hist-item';
            item.innerHTML = `<div class="h-src">${f1} ${src}</div><div class="h-dst">${f2} ${dst}</div>`;
            histList.insertBefore(item, histList.firstChild);
            while (histList.children.length > 8) histList.removeChild(histList.lastChild);
        }

        // ========== Init ==========
        initRec();
        setUI('ar');
        updateLabels();

        // ========== Auto Start ==========
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');

        function beginAuto() {
            startOverlay.classList.add('hidden');
            stxt.textContent = I18N[uiLang].starting;
            // Ask for mic permission inside the user gesture, then start
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then((stream) => {
                        // Stop the local stream - SpeechRecognition uses its own mic
                        stream.getTracks().forEach(t => t.stop());
                        start();
                        stxt.textContent = I18N[uiLang].started;
                    })
                    .catch((err) => {
                        // mic denied - retry directly (user will get browser prompt if possible)
                        start();
                        if (err && err.name === 'NotAllowedError') {
                            stxt.textContent = I18N[uiLang].micDenied;
                            micBtn.classList.remove('rec');
                            waves.classList.remove('on');
                        }
                    });
            } else {
                start();
                stxt.textContent = I18N[uiLang].started;
            }
        }

        if (startBtn) startBtn.onclick = beginAuto;
        const bigMic = document.getElementById('bigMic');
        if (bigMic) bigMic.onclick = beginAuto;

        // ========== Events ==========
        micBtn.onclick = () => isRec ? stop() : start();

        srcSelect.onchange = () => {
            srcLang = srcSelect.value;
            if (rec) {
                rec.lang = srcLang;
                // Restart to apply the new language immediately
                if (isRec) {
                    try {
                        rec.stop();
                        setTimeout(() => { start(); }, 300);
                    } catch (e) {}
                }
            }
            updateLabels();
        };

        dstSelect.onchange = () => {
            dstLang = dstSelect.value;
            updateLabels();
        };

        swapBtn.onclick = () => {
            const temp = srcLang;
            srcLang = dstLang;
            dstLang = temp;
            srcSelect.value = srcLang;
            dstSelect.value = dstLang;
            if (rec) rec.lang = srcLang;
            updateLabels();
            const tempText = srcTxt.textContent;
            srcTxt.textContent = dstTxt.textContent;
            dstTxt.textContent = tempText;
        };

        document.onkeydown = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                e.preventDefault();
                start();
            }
        };

        document.onkeyup = (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                e.preventDefault();
                stop();
            }
        };

        speakBtn.onclick = () => {
            if (lastTranslated) speak(lastTranslated, dstLang);
        };
    </script>
</body>
</html>
