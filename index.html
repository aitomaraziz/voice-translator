<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم الصوت الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 30px 0 20px;
        }

        .header h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #64ffda, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #8892b0;
            font-size: 14px;
        }

        /* Detected Language Display */
        .detected-lang {
            text-align: center;
            padding: 15px;
            background: rgba(100, 255, 218, 0.1);
            border-radius: 16px;
            margin: 15px 0;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }

        .detected-lang .label {
            font-size: 12px;
            color: #8892b0;
            margin-bottom: 8px;
        }

        .detected-lang .lang-name {
            font-size: 24px;
            font-weight: 700;
            color: #64ffda;
        }

        .detected-lang .lang-flag {
            font-size: 32px;
            margin-left: 10px;
        }

        /* Status */
        .status {
            text-align: center;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin: 15px 0;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff6b6b;
            margin-left: 8px;
            vertical-align: middle;
        }

        .status-dot.on {
            background: #64ffda;
            animation: blink 1.5s infinite;
        }

        .status-dot.listening {
            background: #ff6b6b;
            animation: pulse-dot 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        .status-text {
            font-size: 13px;
            color: #8892b0;
            vertical-align: middle;
        }

        /* Talk Button */
        .talk-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .talk-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(145deg, #64ffda, #4dd0b8);
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 0 60px rgba(100, 255, 218, 0.4);
        }

        .talk-btn:hover {
            transform: scale(1.05);
        }

        .talk-btn.listening {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            box-shadow: 0 0 80px rgba(255, 107, 107, 0.6);
            animation: pulse-btn 1s infinite;
        }

        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .mic-icon {
            font-size: 70px;
        }

        .talk-label {
            margin-top: 20px;
            font-size: 18px;
            color: #8892b0;
        }

        /* Wave Animation */
        .wave-container {
            display: none;
            justify-content: center;
            gap: 4px;
            margin-top: 20px;
            height: 50px;
            align-items: center;
        }

        .wave-container.active {
            display: flex;
        }

        .wave-bar {
            width: 5px;
            height: 20px;
            background: #64ffda;
            border-radius: 3px;
            animation: wave 0.8s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { animation-delay: 0.6s; }

        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 50px; }
        }

        /* Text Display */
        .text-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .text-card {
            background: rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            min-height: 80px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .text-card.original {
            border-right: 3px solid #64ffda;
        }

        .text-card.translated {
            border-left: 3px solid #ffd93d;
        }

        .text-card .label {
            font-size: 11px;
            color: #8892b0;
            margin-bottom: 8px;
        }

        .text-card .content {
            font-size: 20px;
            line-height: 1.6;
            color: #ccd6f6;
            word-wrap: break-word;
        }

        .text-card .play-btn {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 217, 61, 0.2);
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .text-card .play-btn:hover {
            background: rgba(255, 217, 61, 0.4);
            transform: scale(1.1);
        }

        .arrow {
            text-align: center;
            font-size: 24px;
            color: #64ffda;
        }

        /* History */
        .history-section {
            margin-top: 10px;
        }

        .history-title {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 10px;
        }

        .history-list {
            max-height: 120px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            border-right: 2px solid #64ffda;
        }

        .history-item .original {
            color: #8892b0;
            margin-bottom: 4px;
        }

        .history-item .translated {
            color: #ffd93d;
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: #5a6a8a;
            font-size: 11px;
        }

        @media (max-width: 400px) {
            .header h1 { font-size: 26px; }
            .talk-btn { width: 150px; height: 150px; }
            .mic-icon { font-size: 60px; }
            .text-card .content { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 المترجم الذكي</h1>
            <p>يتعرف على اللغة تلقائياً من الصوت</p>
        </div>

        <div class="detected-lang" id="detectedLang">
            <div class="label">اللغة المكتشفة</div>
            <div>
                <span class="lang-flag" id="langFlag">🌍</span>
                <span class="lang-name" id="langName">في انتظار الصوت...</span>
            </div>
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">جاري التحقق...</span>
        </div>

        <div class="talk-area">
            <button class="talk-btn" id="talkBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="talk-label" id="talkLabel">اضغط وابدأ بالتحدث</div>
            <div class="wave-container" id="waveContainer">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <div class="text-section">
            <div class="text-card original">
                <div class="label" id="origLabel">ما قلته</div>
                <div class="content" id="origText">...</div>
            </div>
            <div class="arrow">↓</div>
            <div class="text-card translated">
                <div class="label" id="transLabel">الترجمة</div>
                <div class="content" id="transText">...</div>
                <button class="play-btn" id="playBtn" title="تشغيل الصوت">🔊</button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📝 آخر الترجمات</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            يكشف اللغة تلقائياً من الصوت - عربي / صيني / إنجليزي
        </div>
    </div>

    <script>
        // ========== State ==========
        let isListening = false;
        let recognizers = [];
        let currentLang = null;
        let lastTranslation = '';
        let restartTimeout = null;

        // ========== Elements ==========
        const talkBtn = document.getElementById('talkBtn');
        const origText = document.getElementById('origText');
        const transText = document.getElementById('transText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const talkLabel = document.getElementById('talkLabel');
        const waveContainer = document.getElementById('waveContainer');
        const historyList = document.getElementById('historyList');
        const langFlag = document.getElementById('langFlag');
        const langName = document.getElementById('langName');
        const playBtn = document.getElementById('playBtn');
        const origLabel = document.getElementById('origLabel');
        const transLabel = document.getElementById('transLabel');

        // ========== Language Config ==========
        const LANGUAGES = {
            'ar': { name: 'العربية', flag: '🇸🇦', translateTo: 'zh-CN', translateName: '中文' },
            'zh-CN': { name: '中文', flag: '🇨🇳', translateTo: 'ar', translateName: 'العربية' },
            'en': { name: 'English', flag: '🇺🇸', translateTo: 'ar', translateName: 'العربية' }
        };

        // ========== Check Browser ==========
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            statusText.textContent = 'المتصفح لا يدعم التعرف على الصوت - استخدم Chrome';
            talkBtn.disabled = true;
            talkBtn.style.opacity = '0.5';
        } else {
            statusDot.classList.add('on');
            statusText.textContent = 'جاهز - اضغط على الميكروفون';
            initRecognizers();
        }

        // ========== Initialize Multiple Recognizers ==========
        function initRecognizers() {
            // Create a recognizer for each supported language
            ['ar', 'zh-CN', 'en'].forEach(lang => {
                const rec = new SpeechRecognition();
                rec.continuous = true;
                rec.interimResults = true;
                rec.lang = lang;
                rec._lang = lang;

                rec.onresult = (event) => handleResult(event, lang);
                rec.onerror = (event) => handleError(event, lang);
                rec.onend = () => handleEnd(lang);

                recognizers.push(rec);
            });
        }

        // ========== Handle Speech Result ==========
        function handleResult(event, lang) {
            let finalTranscript = '';
            let interimTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                const confidence = event.results[i][0].confidence;

                if (event.results[i].isFinal) {
                    finalTranscript += transcript;
                } else {
                    interimTranscript += transcript;
                }
            }

            if (interimTranscript) {
                origText.textContent = interimTranscript;
            }

            if (finalTranscript) {
                // This is the detected language
                currentLang = lang;
                updateDetectedLanguage(lang);
                origText.textContent = finalTranscript;
                translateText(finalTranscript, lang);
            }
        }

        // ========== Handle Error ==========
        function handleError(event, lang) {
            if (event.error === 'no-speech') {
                // Normal - just no speech detected
            } else if (event.error === 'not-allowed') {
                statusText.textContent = 'يجب السماح بالوصول للميكروفون';
                stopAllRecognizers();
            }
        }

        // ========== Handle End ==========
        function handleEnd(lang) {
            // Auto restart the recognizer that ended
            if (isListening) {
                setTimeout(() => {
                    try {
                        recognizers.find(r => r._lang === lang)?.start();
                    } catch (e) {}
                }, 100);
            }
        }

        // ========== Update Detected Language Display ==========
        function updateDetectedLanguage(lang) {
            const config = LANGUAGES[lang];
            if (config) {
                langFlag.textContent = config.flag;
                langName.textContent = config.name;
                origLabel.textContent = `ما قلته (${config.name})`;
                transLabel.textContent = `الترجمة (${config.translateName})`;
            }
        }

        // ========== Translation ==========
        async function translateText(text, fromLang) {
            if (!text.trim()) return;

            const targetLang = LANGUAGES[fromLang]?.translateTo || 'ar';
            transText.textContent = 'جاري الترجمة...';

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${targetLang}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const translated = data.responseData.translatedText;
                    transText.textContent = translated;
                    lastTranslation = translated;
                    addToHistory(text, translated, fromLang, targetLang);
                    speakTranslation(translated, targetLang);
                } else {
                    transText.textContent = 'خطأ في الترجمة';
                }
            } catch (err) {
                console.error('Translation error:', err);
                transText.textContent = 'تحقق من اتصال الإنترنت';
            }
        }

        // ========== Text to Speech ==========
        function speakTranslation(text, lang) {
            if (!text) return;

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9;

            const voices = window.speechSynthesis.getVoices();
            const targetVoice = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (targetVoice) utterance.voice = targetVoice;

            window.speechSynthesis.speak(utterance);
        }

        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };

        // ========== Start/Stop Listening ==========
        function startListening() {
            if (isListening) return;
            isListening = true;

            recognizers.forEach(rec => {
                try {
                    rec.start();
                } catch (e) {}
            });

            talkBtn.classList.add('listening');
            waveContainer.classList.add('active');
            statusDot.classList.remove('on');
            statusDot.classList.add('listening');
            talkLabel.textContent = 'جاري الاستماع...';
            statusText.textContent = 'يكتشف اللغة تلقائياً...';
        }

        function stopListening() {
            isListening = false;
            stopAllRecognizers();

            talkBtn.classList.remove('listening');
            waveContainer.classList.remove('active');
            statusDot.classList.remove('listening');
            statusDot.classList.add('on');
            talkLabel.textContent = 'اضغط وابدأ بالتحدث';
            statusText.textContent = 'جاهز - اضغط على الميكروفون';
        }

        function stopAllRecognizers() {
            recognizers.forEach(rec => {
                try {
                    rec.stop();
                } catch (e) {}
            });
        }

        // ========== History ==========
        function addToHistory(original, translated, from, to) {
            const fromConfig = LANGUAGES[from];
            const toConfig = LANGUAGES[to];
            
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="original">${fromConfig?.flag || ''} ${original}</div>
                <div class="translated">${toConfig?.flag || ''} ${translated}</div>
            `;
            historyList.insertBefore(item, historyList.firstChild);

            while (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        // ========== Event Listeners ==========
        talkBtn.addEventListener('click', () => {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                if (!isListening) startListening();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                // Don't stop on space release in auto mode - keep listening
            }
        });

        playBtn.addEventListener('click', () => {
            if (lastTranslation && currentLang) {
                const targetLang = LANGUAGES[currentLang]?.translateTo || 'ar';
                speakTranslation(lastTranslation, targetLang);
            }
        });
    </script>
</body>
</html>
